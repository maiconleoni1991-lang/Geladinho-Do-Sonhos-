name: Migrar Geladinho dos Sonhos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate-geladinho.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar repositorio exclusivo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Copiar somente o aplicativo Geladinho dos Sonhos
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$(mktemp -d)"
          git clone --depth 1 https://github.com/maiconleoni1991-lang/maicon-leoni-site.git "$SOURCE_DIR/source"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a "$SOURCE_DIR/source/docs/geladinhos/." .
          touch .nojekyll

          cat > README.md <<'EOF'
          # Geladinho dos Sonhos

          Repositório exclusivo do site e aplicativo de vendas Geladinho dos Sonhos.

          Este projeto contém somente a loja, catálogo, pedidos, acompanhamento, depoimentos, painel administrativo e PWA da marca Geladinho dos Sonhos. Ele é independente do site musical Maicon Leoni.
          EOF

          git config user.name "Geladinho dos Sonhos Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Migrar aplicativo Geladinho dos Sonhos para repositorio exclusivo"
            git push origin HEAD:main
          fi

# disparo de migracao exclusiva v1
