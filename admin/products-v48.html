<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Produtos e Estoque — GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1180px;margin:auto;padding:16px 12px 70px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:900}.primary{background:#ff0f68;color:#fff}.ghost{background:#fff;border:1px solid #efdde4;color:#4a101e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #efdde4;border-radius:16px;padding:12px}.stat small{color:#78616a}.stat b{display:block;font-size:24px;color:#4a101e}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{border:1px solid #efdde4;border-radius:11px;padding:10px;background:#fff}.tools input{flex:1;min-width:180px}.card{background:#fff;border:1px solid #efdde4;border-radius:18px;overflow:hidden}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid #f4e9ed;text-align:left;font-size:13px}th{color:#78616a;background:#fffafd}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{border:1px solid #efdde4;background:#fff;border-radius:9px;padding:7px 9px;font-weight:800}.stockCtl{display:flex;align-items:center;gap:6px}.stockCtl button{width:32px;height:32px;border:1px solid #efdde4;background:#fff;border-radius:8px;font-weight:900}.msg{margin:10px 0;padding:11px;border-radius:11px;background:#fff;border:1px solid #efdde4;color:#78616a}.ok{color:#14753e}.err{color:#b02a42}dialog{width:min(600px,calc(100% - 24px));border:0;border-radius:22px;padding:0;box-shadow:0 30px 90px #2a0a164d}dialog::backdrop{background:#2a0a1677}.modal{padding:18px}.modal h2{margin:0 0 10px;color:#4a101e}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:12px;color:#78616a;font-weight:800}.field input,.field select,.field textarea{display:block;width:100%;margin-top:5px;border:1px solid #efdde4;border-radius:11px;padding:10px;background:#fff}.full{grid-column:1/-1}.preview{width:120px;height:120px;border:1px dashed #efdde4;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#78616a}.preview img{width:100%;height:100%;object-fit:cover}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:430px){.stats{grid-template-columns:1fr}}</style></head><body><script src="admin-common-v48.js?v=92"></script><main class="wrap"><div class="head"><div><h1>Produtos / Estoque</h1><div style="font-size:12px;color:#78616a">Controle direto do estoque geral</div></div><div class="sp"></div><button id="refresh" class="btn ghost">↻ Atualizar</button><button id="new" class="btn primary">+ Novo produto</button></div><div id="msg" class="msg">Conectando ao estoque…</div><section class="stats"><div class="stat"><small>Produtos cadastrados</small><b id="sProducts">—</b></div><div class="stat"><small>Ativos</small><b id="sActive">—</b></div><div class="stat"><small>Unidades em estoque</small><b id="sStock">—</b></div></section><div class="tools"><input id="search" type="search" placeholder="Buscar sabor…"><select id="cat"><option value="">Todas categorias</option><option>Tradicional</option><option>Cremoso</option><option>Gourmet</option><option>Trufado</option></select></div><section class="card"><div class="table"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="dlg"><div class="modal"><h2 id="title">Produto</h2><div class="form"><div class="field full"><label>Nome<input id="name"></label></div><div class="field"><label>Categoria<select id="category"><option>Tradicional</option><option>Cremoso</option><option>Gourmet</option><option>Trufado</option></select></label></div><div class="field"><label>Preço<input id="price" type="number" min="0" step="0.01"></label></div><div class="field"><label>Estoque<input id="stock" type="number" min="0" step="1"></label></div><div class="field"><label>Disponível<select id="active"><option value="true">Sim</option><option value="false">Não</option></select></label></div><div class="field full"><label>Descrição<textarea id="desc" rows="4"></textarea></label></div><div class="field full"><label>Imagem<input id="image" type="file" accept="image/*"></label><div id="preview" class="preview">Sem imagem</div></div></div><div id="saveMsg" class="msg"></div><div class="modalBtns"><button id="cancel" class="btn ghost">Cancelar</button><button id="save" class="btn primary">Salvar</button></div></div></dialog><script>(async()=>{const $=x=>document.getElementById(x);let products=[],editing=null,imageFile=null;const prices={Tradicional:1.5,Cremoso:4,Gourmet:6,Trufado:7.5};function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36)}function setMsg(t,type=''){$('msg').textContent=t;$('msg').className='msg '+type}async function load(){setMsg('Carregando produtos…');const {data,error}=await GDS48.sb.from('products').select('*').order('sort_order');if(error){setMsg('Erro: '+error.message,'err');return}products=data||[];render();setMsg(`🟢 ${products.length} produtos carregados do Supabase`,'ok')}function render(){const q=$('search').value.trim().toLowerCase(),c=$('cat').value;const list=products.filter(p=>(!q||(`${p.name} ${p.category}`).toLowerCase().includes(q))&&(!c||p.category===c));$('rows').innerHTML=list.map(p=>`<tr><td><b>${GDS48.esc(p.name)}</b></td><td>${GDS48.esc(p.category)}</td><td>${GDS48.money(p.price)}</td><td><div class="stockCtl"><button onclick="adj('${p.id}',-1)">−</button><b>${p.stock}</b><button onclick="adj('${p.id}',1)">+</button></div></td><td>${p.active?'✅ Ativo':'⏸️ Pausado'}</td><td class="actions"><button onclick="editP('${p.id}')">Editar</button><button onclick="toggleP('${p.id}')">${p.active?'Pausar':'Ativar'}</button><button onclick="delP('${p.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhum produto encontrado.</td></tr>';$('sProducts').textContent=products.length;$('sActive').textContent=products.filter(p=>p.active).length;$('sStock').textContent=products.reduce((n,p)=>n+(Number(p.stock)||0),0)}function open(p=null){editing=p?.id||null;imageFile=null;$('title').textContent=p?'Editar produto':'Novo produto';$('name').value=p?.name||'';$('category').value=p?.category||'Cremoso';$('price').value=p?.price??prices.Cremoso;$('stock').value=p?.stock??0;$('active').value=String(p?.active??true);$('desc').value=p?.description||'';$('preview').innerHTML=p?.image_url?`<img src="${p.image_url}">`:'Sem imagem';$('saveMsg').textContent='';$('dlg').showModal()}window.editP=id=>open(products.find(p=>p.id===id));window.adj=async(id,d)=>{const p=products.find(x=>x.id===id),next=Math.max(0,(Number(p.stock)||0)+d);const {error}=await GDS48.sb.from('products').update({stock:next}).eq('id',id);if(error)return setMsg('Erro ao atualizar estoque: '+error.message,'err');p.stock=next;render();setMsg(`Estoque de ${p.name} atualizado para ${next}.`,'ok')};window.toggleP=async id=>{const p=products.find(x=>x.id===id);const {error}=await GDS48.sb.from('products').update({active:!p.active}).eq('id',id);if(error)return setMsg(error.message,'err');p.active=!p.active;render()};window.delP=async id=>{const p=products.find(x=>x.id===id);if(!confirm(`Excluir ${p.name}?`))return;const {error}=await GDS48.sb.from('products').delete().eq('id',id);if(error)return setMsg(error.message,'err');await load()};$('new').onclick=()=>open();$('refresh').onclick=load;$('search').oninput=render;$('cat').onchange=render;$('cancel').onclick=()=>$('dlg').close();$('category').onchange=()=>{if(!editing)$('price').value=prices[$('category').value]??0};$('image').onchange=e=>{imageFile=e.target.files?.[0]||null;if(imageFile)$('preview').innerHTML=`<img src="${URL.createObjectURL(imageFile)}">`};$('save').onclick=async()=>{const name=$('name').value.trim();if(!name){$('saveMsg').textContent='Informe o nome.';return}let image_url=editing?products.find(p=>p.id===editing)?.image_url:null;if(imageFile){const ext=(imageFile.name.split('.').pop()||'webp').toLowerCase(),path=`${crypto.randomUUID()}.${ext}`;const up=await GDS48.sb.storage.from('product-images').upload(path,imageFile,{contentType:imageFile.type||undefined});if(up.error){$('saveMsg').textContent=up.error.message;return}image_url=GDS48.sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}const payload={name,category:$('category').value,price:Number($('price').value)||0,stock:Math.max(0,Number($('stock').value)||0),active:$('active').value==='true',description:$('desc').value.trim()||null,image_url};let error;if(editing)({error}=await GDS48.sb.from('products').update(payload).eq('id',editing));else{payload.slug=slug(name);payload.sort_order=(products.at(-1)?.sort_order||0)+10;({error}=await GDS48.sb.from('products').insert(payload))}if(error){$('saveMsg').textContent=error.message;return}$('dlg').close();await load()};try{await GDS48.ensure('products');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message,'err')}})();</script></body></html>
