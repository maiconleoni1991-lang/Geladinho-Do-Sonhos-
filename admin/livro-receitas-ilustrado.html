<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Livro de Receitas Ilustrado | Geladinho dos Sonhos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>
:root{--vinho:#860c31;--rosa:#e84477;--creme:#fff5ee}*{box-sizing:border-box}body{background:#faedf0;color:#3b1b24;font:15px/1.5 Georgia,serif;margin:0}header{max-width:1100px;margin:15px auto;padding:15px;background:#fff;border-radius:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font:14px system-ui}.controls{display:flex;gap:8px;flex-wrap:wrap}button,a.link{border:0;border-radius:9px;background:var(--vinho);color:#fff;padding:10px 14px;text-decoration:none;font:700 13px system-ui;cursor:pointer}.link.secondary{background:#f3dfe7;color:var(--vinho)}.notice{max-width:1100px;margin:10px auto;padding:12px;background:white;border-radius:10px;font:13px system-ui}.recipe{width:min(1040px,calc(100% - 24px));min-height:1330px;margin:20px auto;background:linear-gradient(150deg,#fff4ec,#fff9f5 48%,#f9e4dc);box-shadow:0 15px 55px #670c3722;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:365px auto auto;overflow:hidden;break-after:page;page-break-after:always;border-radius:7px}.hero{grid-column:1/-1;display:grid;grid-template-columns:43% 57%;background:#fcf0e9}.photo{background:linear-gradient(150deg,#a21346,#e9859d);display:grid;place-items:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo .placeholder{padding:25px;text-align:center;color:white;font:italic bold 32px Georgia}.intro{padding:23px 30px}.kicker{font:12px system-ui;letter-spacing:.15em;color:var(--vinho);text-transform:uppercase}.intro h1{font:italic 62px/1 Georgia;color:#af0d43;margin:20px 0 14px;overflow-wrap:anywhere}.intro p{font-size:18px;line-height:1.55}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.tags span{background:#fff;border:1px solid #f0d9d5;border-radius:11px;padding:11px;font:13px system-ui}.block{padding:22px 28px}.block h2{background:linear-gradient(100deg,#a50b39,#ed4d7c);color:white;border-radius:30px;font-size:22px;margin:0 0 16px;padding:10px 17px}.items{width:100%;border-collapse:collapse}.items td{padding:9px 3px;border-bottom:1px solid #e9d4d1}.items td:last-child{text-align:right;white-space:nowrap;padding-left:12px;font-weight:bold}.steps{margin:0;padding-left:22px}.steps li{padding:7px 0}.muted{color:#704657}.editorial-note{border:1px dashed #d69ba9;background:#fff7f8;padding:13px;border-radius:12px}.footer{grid-column:1/-1;padding:18px 27px;background:#fff3ef;display:grid;grid-template-columns:1fr 1fr;gap:17px}.footer h2{font-size:18px;color:var(--vinho)}.footer p{font-size:14px;margin:7px 0}.warn{font:12px system-ui;color:#755267}.empty{padding:35px;text-align:center} @media(max-width:700px){.recipe{grid-template-columns:1fr;grid-template-rows:auto}.hero{grid-template-columns:1fr}.photo{height:240px}.intro h1{font-size:45px}.block{padding:15px}.footer{grid-template-columns:1fr}.recipe{min-height:0}}@page{size:A4 portrait;margin:0}@media print{body{background:white}header,.notice{display:none!important}.recipe{width:210mm;height:297mm;min-height:297mm;margin:0;border-radius:0;box-shadow:none;grid-template-rows:86mm auto auto}.photo{print-color-adjust:exact;-webkit-print-color-adjust:exact}.block h2,.footer,.hero{print-color-adjust:exact;-webkit-print-color-adjust:exact}.intro h1{font-size:43px}.block{padding:13px 20px}.items td{padding:5px 2px}.footer{padding:9px 20px}.recipe:last-child{break-after:auto}} </style></head><body><script src="admin-common-v48.js?v=141"></script><header><div><strong>📖 Geladinho dos Sonhos — Livro de Receitas</strong><br><small>Fichas para consulta e diagramação do futuro e-book</small></div><div class="controls"><a href="receitas-bases-v1.html#book" class="link secondary">← Livro de receitas</a><button type="button" onclick="window.print()">🖨️ Imprimir / salvar PDF</button></div></header><div id="status" class="notice">Carregando receitas cadastradas...</div><main id="pages"></main><script>
(async()=>{const money=(x)=>Number(x).toLocaleString('pt-BR',{maximumFractionDigits:3}),esc=x=>GDS48.esc(String(x??''));const unit={g:'g',ml:'ml',cx:'caixa(s)',pct:'pacote(s)',un:'unidade(s)'};const $=id=>document.getElementById(id);
function matchPhoto(b,products){const k=b.recipe_name.toLocaleLowerCase('pt-BR').replace(/gourmet|geladinho|com creme de pistache|\./g,'').trim();let p=products.find(x=>x.name.toLocaleLowerCase('pt-BR')===k);if(!p)p=products.find(x=>k.length>4&&x.name.toLocaleLowerCase('pt-BR').includes(k));return p?.image_url||''}
try{await GDS48.ensure('recipes');const [r,p]=await Promise.all([GDS48.sb.from('gds_recipe_book').select('*').order('recipe_name'),GDS48.sb.from('products').select('name,image_url')]);if(r.error)throw r.error;const recipes=r.data||[],products=p.data||[];$('status').textContent='✅ '+recipes.length+' fichas reunidas. Esta versão é um rascunho editorial: confira preparo, rendimento e rotulagem antes de comercializar.';$('pages').innerHTML=recipes.map(b=>{const a=Array.isArray(b.ingredients)?b.ingredients:[],active=a.filter(i=>i.active!==false),optional=a.filter(i=>i.active===false),url=matchPhoto(b,products);const rows=active.map(i=>'<tr><td>'+esc(i.name)+(i.brand?' — '+esc(i.brand):'')+'</td><td>'+esc(money(i.quantity_used))+' '+esc(unit[i.unit]||i.unit||'')+'</td></tr>').join('');const opt=optional.map(i=>'<p>'+esc(i.name)+': opcional (quantidade a confirmar)</p>').join('');const lines=(b.preparation||'').split(/\n+/).filter(Boolean);return '<article class="recipe"><div class="hero"><div class="photo">'+(url?'<img src="'+esc(url)+'" alt="Foto do produto '+esc(b.recipe_name)+'">':'<div class="placeholder">Geladinho<br>dos Sonhos<br>🍦</div>')+'</div><div class="intro"><div class="kicker">Geladinhos gourmet · Receitas exclusivas</div><h1>'+esc(b.recipe_name)+'</h1><p>Ficha de produção da linha '+esc(b.category||'Gourmet')+' do Geladinho dos Sonhos.</p><div class="tags"><span>Categoria: '+esc(b.category||'—')+'</span><span>Rendimento: '+(b.yield_units?b.yield_units+' unidades':'a confirmar')+'</span></div></div></div><div class="block"><h2>🥣 Ingredientes</h2><table class="items">'+rows+'</table>'+(opt?'<div class="editorial-note"><strong>Ingredientes opcionais</strong>'+opt+'</div>':'')+'</div><div class="block"><h2>👩‍🍳 Modo de preparo</h2>'+(lines.length?'<ol class="steps">'+lines.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>':'<div class="editorial-note"><strong>Preparo a revisar</strong><p>Esta receita ainda não tem instruções de preparo cadastradas. Complete e valide antes de publicar o e-book.</p></div>')+'<h2 style="margin-top:22px">📦 Rendimento</h2><p>'+esc(b.yield_units||'A confirmar')+' geladinhos por receita, conforme cadastro.</p><p class="warn">Peso final, volume e rendimento devem ser conferidos em cada produção.</p></div><div class="footer"><div><h2>📝 Observações de produção</h2><p>Padronize o envase, mantenha higiene rigorosa e registre o rendimento real.</p><p class="warn">Arte editorial em revisão — não divulgar como receita testada sem conferência.</p></div><div><h2>🏷️ Informações para rotulagem</h2><p>Verificar ingredientes, alergênicos, lactose e demais exigências aplicáveis antes da venda.</p><p class="warn">As informações de rotulagem variam conforme os ingredientes efetivamente utilizados.</p></div></div></article>'}).join('')||'<div class="empty">Não há receitas cadastradas.</div>'; }catch(e){$('status').textContent='Não foi possível carregar as receitas: '+e.message}})();
</script></body></html>
