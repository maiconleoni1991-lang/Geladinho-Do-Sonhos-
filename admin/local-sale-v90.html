<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><meta name="robots" content="noindex,nofollow,noarchive"><title>Venda no Local — GDS Admin v90</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1180px;margin:auto;padding:16px 12px 80px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900}.primary{background:#ff0f68;color:#fff;border-color:#ff0f68}.msg{margin:12px 0;padding:11px;background:#fff;border:1px solid #efdde4;border-radius:11px;color:#78616a}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:14px}.panel{background:#fff;border:1px solid #efdde4;border-radius:18px;padding:14px;box-shadow:0 12px 30px #4a101e0d}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{border:1px solid #efdde4;border-radius:11px;padding:10px;background:#fff}.tools input{flex:1;min-width:180px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.product{border:1px solid #efdde4;border-radius:14px;padding:11px;background:#fffafd}.product h3{margin:0 0 4px;font-size:14px;color:#4a101e}.product small{color:#78616a}.product .price{font-weight:950;color:#ff0f68;margin:8px 0}.product button{width:100%;border:0;border-radius:10px;padding:9px;background:#ff0f68;color:#fff;font-weight:900}.product button:disabled{background:#ddd;color:#777}.cartRow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #f3e7ec}.qty{display:flex;gap:6px;align-items:center;margin-top:5px}.qty button{width:30px;height:30px;border:1px solid #efdde4;background:#fff;border-radius:8px;font-weight:950}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:950;color:#4a101e;padding:14px 0}.field{margin-top:10px}.field label{font-size:12px;font-weight:800;color:#78616a}.field input,.field textarea{display:block;width:100%;margin-top:5px;border:1px solid #efdde4;border-radius:11px;padding:10px;background:#fff}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pay label{border:1px solid #efdde4;border-radius:12px;padding:11px;font-weight:900;background:#fffafd}.pixBox{margin-top:10px;padding:12px;border:1px solid #efdde4;border-radius:14px;background:#fffafc;text-align:center}.pixBox canvas{display:block;margin:8px auto;max-width:210px;width:100%}.confirm{display:flex;gap:8px;align-items:flex-start;margin:12px 0;padding:10px;background:#fff8e6;border:1px solid #f0d89a;border-radius:12px;font-size:13px}.success{padding:13px;border-radius:12px;background:#eaf8ef;border:1px solid #bce3ca;color:#14753e;font-weight:800;margin-top:10px}.empty{padding:25px;text-align:center;color:#78616a}.cat{font-size:11px;font-weight:850;color:#78616a;text-transform:uppercase}@media(max-width:900px){.layout{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.products{grid-template-columns:1fr}.pay{grid-template-columns:1fr}}
</style></head><body><script src="admin-common-v48.js?v=90"></script><main class="wrap"><div class="head"><div><h1>🧾 Venda no Local</h1><div style="font-size:12px;color:#78616a">Balcão / porta · baixa automática do estoque · Pix ou Dinheiro</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar estoque</button></div><div id="msg" class="msg">Carregando produtos…</div><section class="layout"><div class="panel"><div class="tools"><input id="search" placeholder="Buscar sabor…"><select id="cat"><option value="">Todas categorias</option><option>Tradicional</option><option>Cremoso</option><option>Gourmet</option><option>Trufado</option></select></div><div id="products" class="products"></div></div><div class="panel"><h2 style="margin-top:0;color:#4a101e">Venda atual</h2><div id="cart"></div><div class="total"><span>Total</span><span id="total">R$ 0,00</span></div><div class="field"><label>Cliente (opcional)<input id="customer" placeholder="Venda no local"></label></div><div class="field"><label>Observação (opcional)<textarea id="notes" rows="2"></textarea></label></div><div class="field"><label>Forma de pagamento</label><div class="pay"><label><input type="radio" name="payment" value="Pix" checked> 💠 Pix</label><label><input type="radio" name="payment" value="Dinheiro"> 💵 Dinheiro</label></div></div><div id="pixBox" class="pixBox"><b>💠 Pix Geladinho dos Sonhos</b><canvas id="pixQr" width="210" height="210"></canvas><div style="font-size:11px;color:#78616a">Mostre este QR Code ao cliente e finalize a venda após confirmar o pagamento.</div></div><label class="confirm"><input id="received" type="checkbox"> <span>Confirmo que o pagamento foi recebido e posso finalizar a venda.</span></label><button id="finish" class="btn primary" style="width:100%;font-size:16px" disabled>Finalizar venda no local</button><div id="result"></div></div></section></main><script>
(async()=>{const $=x=>document.getElementById(x),PIX='00020126590014br.gov.bcb.pix0114+55169925428880219Geladinho_do_Sonhos5204000053039865802BR5918MONIZA_SERIO_LEONI6010MONTE_ALTO62290525OBtb6HFcnS50h7i6lItP47SZu6304BB06';let products=[],cart={};
const money=v=>GDS48.money(v);
function payment(){return document.querySelector('input[name="payment"]:checked')?.value||'Pix'}
async function load(){const {data,error}=await GDS48.sb.from('products').select('id,name,category,price,stock,active').eq('active',true).order('category').order('name');if(error){$('msg').textContent='Erro: '+error.message;return}products=(data||[]).map(p=>({...p,stock:Number(p.stock)||0,price:Number(p.price)||0}));cleanCart();renderProducts();renderCart();$('msg').textContent='🟢 Estoque atualizado'}
function cleanCart(){for(const id of Object.keys(cart)){const p=products.find(x=>x.id===id);if(!p||p.stock<=0)delete cart[id];else if(cart[id]>p.stock)cart[id]=p.stock}}
function renderProducts(){const q=$('search').value.trim().toLowerCase(),cat=$('cat').value;const order={Tradicional:0,Cremoso:1,Gourmet:2,Trufado:3};const list=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cat||p.category===cat)).sort((a,b)=>(a.stock<=0?1:0)-(b.stock<=0?1:0)||(order[a.category]??9)-(order[b.category]??9)||a.name.localeCompare(b.name,'pt-BR'));$('products').innerHTML=list.map(p=>'<article class="product"><div class="cat">'+GDS48.esc(p.category)+'</div><h3>'+GDS48.esc(p.name)+'</h3><small>'+p.stock+' em estoque</small><div class="price">'+money(p.price)+'</div><button '+(p.stock<=0?'disabled':'')+' onclick="add(\''+p.id+'\')">'+(p.stock<=0?'Esgotado':'Adicionar')+'</button></article>').join('')||'<div class="empty">Nenhum produto encontrado.</div>'}
function total(){return Object.entries(cart).reduce((s,[id,q])=>{const p=products.find(x=>x.id===id);return s+(p?p.price*q:0)},0)}
function renderCart(){const rows=Object.entries(cart).filter(([,q])=>q>0);$('cart').innerHTML=rows.length?rows.map(([id,q])=>{const p=products.find(x=>x.id===id);return '<div class="cartRow"><div><b>'+GDS48.esc(p.name)+'</b><div class="qty"><button onclick="qty(\''+id+'\',-1)">−</button><span>'+q+'</span><button onclick="qty(\''+id+'\',1)">+</button></div></div><b>'+money(p.price*q)+'</b></div>'}).join(''):'<div class="empty">Nenhum item na venda.</div>';$('total').textContent=money(total());syncFinish()}
window.add=id=>{const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return;cart[id]=Math.min((cart[id]||0)+1,p.stock);renderCart()};
window.qty=(id,d)=>{const p=products.find(x=>x.id===id);if(!p)return;const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else cart[id]=Math.min(n,p.stock);renderCart()};
function syncFinish(){$('finish').disabled=!Object.keys(cart).length||!$('received').checked}
function syncPayment(){$('pixBox').style.display=payment()==='Pix'?'block':'none'}
async function finish(){if(!Object.keys(cart).length)return;if(!$('received').checked)return;const items=Object.entries(cart).map(([product_id,quantity])=>({product_id,quantity}));$('finish').disabled=true;$('finish').textContent='Finalizando…';const {data,error}=await GDS48.sb.rpc('create_local_sale_v90',{p_customer_name:$('customer').value.trim()||'Venda no local',p_payment_method:payment(),p_notes:$('notes').value.trim()||null,p_items:items});if(error){$('result').innerHTML='<div class="msg" style="color:#b02a42">Erro: '+GDS48.esc(error.message)+'</div>';syncFinish();$('finish').textContent='Finalizar venda no local';return}cart={};$('customer').value='';$('notes').value='';$('received').checked=false;$('result').innerHTML='<div class="success">✅ Venda '+GDS48.esc(data.public_code)+' finalizada · '+money(data.total)+' · '+GDS48.esc(data.payment_method)+'</div>';$('finish').textContent='Finalizar venda no local';await load()}
$('refresh').onclick=load;$('search').oninput=renderProducts;$('cat').onchange=renderProducts;$('received').onchange=syncFinish;document.querySelectorAll('input[name="payment"]').forEach(x=>x.onchange=syncPayment);$('finish').onclick=finish;try{QRCode.toCanvas($('pixQr'),PIX,{width:210,margin:1},()=>{})}catch(_){}
try{await GDS48.ensure('local');await load();syncPayment()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))$('msg').textContent='Erro de acesso: '+err.message}
})();
</script></body></html>
