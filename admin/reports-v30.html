<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=30"><title>Relatórios — Geladinho dos Sonhos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>:root{--p:#ff0f68;--w:#4a101e;--line:#efdde4;--muted:#78616a;--red:#c9364d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#fff8fb;color:#29171d}.wrap{max-width:1180px;margin:auto;padding:14px}.head{position:sticky;top:0;z-index:20;background:#fffafcee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:-14px -14px 14px;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h1{margin:0;color:var(--w);font-size:24px}.head small{display:block;color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:7px}.actions button,.filters button,.custom button{border:1px solid var(--line);background:#fff;color:var(--w);border-radius:12px;padding:10px 12px;font-weight:900}.actions .primary,.filters button.on,.custom button{background:var(--p);color:#fff;border-color:var(--p)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.custom{display:none;gap:7px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.custom.show{display:flex}.custom label{font-size:11px;color:var(--muted);font-weight:800}.custom input{display:block;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.card,.section{background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px rgba(99,23,51,.05)}.card{border-radius:18px;padding:14px}.card small{color:var(--muted);font-size:11px}.card b{display:block;color:var(--w);font-size:24px;margin-top:5px}.accent{color:var(--p)!important}.danger{color:var(--red)!important}.section{border-radius:20px;padding:15px;margin:12px 0}.section h2{margin:0 0 12px;color:var(--w);font-size:18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #f4e6eb;font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase}.cancel{color:var(--red);font-weight:850}.barrow{display:grid;grid-template-columns:minmax(100px,1fr) 2fr auto;gap:8px;align-items:center;margin:9px 0;font-size:12px}.bar{height:10px;background:#f5e4eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff0f68,#ff7cab);border-radius:99px}.reason{background:#fff1f4;border:1px solid #f1c0cb;border-radius:10px;padding:8px;margin:6px 0;font-size:12px}.empty{text-align:center;color:var(--muted);padding:35px}.warn{background:#fff0f5;border:1px solid #ffc9db;padding:14px;border-radius:14px}.foot{font-size:11px;color:var(--muted);text-align:right;margin-top:8px}@media(max-width:950px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.actions{width:100%;margin:0}.actions button{flex:1}.filters{display:grid;grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:10px}.head{margin:-10px -10px 10px;padding:10px}.card b{font-size:20px}}@media print{.head,.filters,.custom,.actions{display:none!important}body{background:#fff}.section,.card{box-shadow:none;break-inside:avoid}}</style></head><body><div class="wrap"><div class="head"><div><h1>📊 Relatório de vendas</h1><small>Faturamento considera somente pedidos finalizados.</small></div><div class="actions"><button id="csv" class="primary">⬇ Exportar CSV</button><button id="print">🖨 Imprimir / PDF</button></div></div><div id="msg"></div><div class="filters"><button data-p="today">Hoje</button><button data-p="7">7 dias</button><button data-p="30" class="on">30 dias</button><button data-p="month">Este mês</button><button data-p="custom">Personalizado</button></div><div id="custom" class="custom"><label>De<input id="from" type="date"></label><label>Até<input id="to" type="date"></label><button id="apply">Aplicar</button></div><div id="cards" class="cards"></div><div class="split"><section class="section"><h2>Vendas por dia</h2><div id="daily"></div></section><section class="section"><h2>Produtos mais vendidos</h2><div id="products"></div></section></div><section class="section"><h2>Pedidos do período</h2><div id="orders" class="tableWrap"></div></section><section class="section"><h2>Cancelamentos</h2><div id="reasons"></div></section><div id="foot" class="foot"></div></div><script>const{createClient}=supabase,sb=createClient('https://qpqruhcspbdxjcnbhdhn.supabase.co','sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk'),$=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],period='30',range=null;async function admin(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const{data}=await sb.from('admin_users').select('user_id').maybeSingle();return!!data}function sd(d){const x=new Date(d);x.setHours(0,0,0,0);return x}function ed(d){const x=new Date(d);x.setHours(23,59,59,999);return x}function calc(){const n=new Date(),e=ed(n),s=new Date(n);if(period==='today')return[sd(n),e];if(period==='7'){s.setDate(s.getDate()-6);return[sd(s),e]}if(period==='30'){s.setDate(s.getDate()-29);return[sd(s),e]}if(period==='month')return[new Date(n.getFullYear(),n.getMonth(),1),e];if(period==='custom'&&range)return range;return[sd(n),e]}async function load(){if(!await admin()){$('msg').innerHTML='<div class="warn">Entre primeiro em Produtos / Estoque com sua conta de administrador.</div>';return}const[a,b]=calc(),{data,error}=await sb.from('orders').select('id,public_code,customer_name,fulfillment,subtotal,delivery_fee,total,status,cancel_reason,canceled_by,created_at,updated_at,order_items(product_name,unit_price,quantity)').in('status',['Finalizado','Cancelado']).gte('created_at',a.toISOString()).lte('created_at',b.toISOString()).order('created_at',{ascending:false}).limit(2000);if(error){$('msg').textContent=error.message;return}rows=data||[];render(a,b)}function render(a,b){const sales=rows.filter(o=>o.status==='Finalizado'),canc=rows.filter(o=>o.status==='Cancelado'),total=sales.reduce((s,o)=>s+Number(o.total||0),0),ticket=sales.length?total/sales.length:0,items=sales.flatMap(o=>o.order_items||[]),qty=items.reduce((s,i)=>s+Number(i.quantity||0),0);$('cards').innerHTML=`<div class="card"><small>Faturamento</small><b class="accent">${money(total)}</b></div><div class="card"><small>Finalizados</small><b>${sales.length}</b></div><div class="card"><small>Ticket médio</small><b>${money(ticket)}</b></div><div class="card"><small>Geladinhos vendidos</small><b>${qty}</b></div><div class="card"><small>Cancelados</small><b class="danger">${canc.length}</b></div>`;const days={};sales.forEach(o=>{const k=new Date(o.created_at).toLocaleDateString('pt-BR');days[k]??={t:0,c:0};days[k].t+=Number(o.total||0);days[k].c++});$('daily').innerHTML=Object.keys(days).length?`<div class="tableWrap"><table class="table"><thead><tr><th>Dia</th><th>Pedidos</th><th>Vendas</th></tr></thead><tbody>${Object.entries(days).map(([d,x])=>`<tr><td><b>${d}</b></td><td>${x.c}</td><td>${money(x.t)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem vendas finalizadas.</div>';const prod={};items.forEach(i=>{prod[i.product_name]??=0;prod[i.product_name]+=Number(i.quantity||0)});const ps=Object.entries(prod).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...ps.map(x=>x[1]));$('products').innerHTML=ps.length?ps.slice(0,10).map(([n,q])=>`<div class="barrow"><span>${esc(n)}</span><div class="bar"><i style="width:${q/max*100}%"></i></div><b>${q} un.</b></div>`).join(''):'<div class="empty">Sem produtos vendidos.</div>';$('orders').innerHTML=rows.length?`<table class="table"><thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Status</th><th>Tipo</th><th>Total</th><th>Motivo</th><th>Responsável</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td><b>#${esc(o.public_code)}</b></td><td>${esc(o.customer_name)}</td><td class="${o.status==='Cancelado'?'cancel':''}">${esc(o.status)}</td><td>${o.fulfillment==='entrega'?'Entrega':'Retirada'}</td><td>${o.status==='Finalizado'?money(o.total):'—'}</td><td>${esc(o.cancel_reason||'—')}</td><td>${esc(o.canceled_by||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum pedido no período.</div>';const rs={};canc.forEach(o=>{const k=`${o.cancel_reason||'Motivo não informado'} · ${o.canceled_by||'responsável não informado'}`;rs[k]=(rs[k]||0)+1});$('reasons').innerHTML=Object.keys(rs).length?Object.entries(rs).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`<div class="reason"><b>${n}x</b> ${esc(r)}</div>`).join(''):'<div class="empty">Nenhum cancelamento.</div>';$('foot').textContent=`Período: ${a.toLocaleDateString('pt-BR')} a ${b.toLocaleDateString('pt-BR')} · Atualizado ${new Date().toLocaleString('pt-BR')}`}function csv(){if(!rows.length)return alert('Não há pedidos para exportar.');const lines=[['Data','Pedido','Cliente','Status','Tipo','Subtotal','Taxa entrega','Total','Motivo cancelamento','Responsável cancelamento','Itens'],...rows.map(o=>[new Date(o.created_at).toLocaleString('pt-BR'),o.public_code,o.customer_name,o.status,o.fulfillment==='entrega'?'Entrega':'Retirada',Number(o.subtotal||0).toFixed(2).replace('.',','),Number(o.delivery_fee||0).toFixed(2).replace('.',','),o.status==='Finalizado'?Number(o.total||0).toFixed(2).replace('.',','):'',o.cancel_reason||'',o.canceled_by||'',(o.order_items||[]).map(i=>`${i.quantity}x ${i.product_name}`).join(' | ')])];const text='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),blob=new Blob([text],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='relatorio-vendas-geladinho-dos-sonhos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');period=b.dataset.p;$('custom').classList.toggle('show',period==='custom');if(period!=='custom')load()});$('apply').onclick=()=>{if(!$('from').value||!$('to').value)return alert('Escolha as duas datas.');const a=sd(new Date($('from').value+'T12:00:00')),b=ed(new Date($('to').value+'T12:00:00'));if(a>b)return alert('Período inválido.');range=[a,b];load()};$('csv').onclick=csv;$('print').onclick=()=>window.print();load();</script></body></html>
