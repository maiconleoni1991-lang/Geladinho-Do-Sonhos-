<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>MFA — GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(#fff6fa,#fff);font-family:Inter,system-ui;color:#29171d}.card{width:min(440px,100%);background:#fff;border:1px solid #efdde4;border-radius:24px;padding:24px;box-shadow:0 25px 70px #4a101e1a;text-align:center}.logo{width:88px;height:88px;object-fit:contain}.card h1{color:#4a101e;margin:6px 0}.card p{color:#78616a;line-height:1.5}input{width:100%;height:60px;border:2px solid #efdde4;border-radius:14px;padding:10px;text-align:center;font-size:28px;letter-spacing:.25em;outline:0}input:focus{border-color:#ff0f68;box-shadow:0 0 0 4px #ff0f6818}button{width:100%;min-height:50px;border:0;border-radius:13px;padding:12px;margin-top:10px;font-weight:900}.primary{background:linear-gradient(90deg,#ff0f68,#ff4e8e);color:#fff}.ghost{background:#fff0f5;color:#6a1936}.msg{min-height:22px;margin-top:12px;font-size:13px;color:#b02a42}.ok{color:#14753e}</style></head><body><main class="card"><img class="logo" src="../assets/logo-oficial.webp?v=48"><h1>Confirmação de segurança</h1><p>Digite o código de 6 dígitos do seu aplicativo autenticador.</p><form id="form"><input id="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="verify" class="primary" type="submit">Confirmar e abrir painel</button></form><button id="logout" class="ghost">Sair da conta</button><div id="msg" class="msg"></div></main><script>(()=>{const sb=supabase.createClient('https://qpqruhcspbdxjcnbhdhn.supabase.co','sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk'),$=x=>document.getElementById(x);let busy=false;async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login-v48.html?v=48');return}const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.data?.currentLevel==='aal2'){location.replace('./?v=48');return}setTimeout(()=>$('code').focus(),120)}$('code').oninput=()=>{$('code').value=$('code').value.replace(/\D/g,'').slice(0,6)};$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const code=$('code').value.trim();if(!/^\d{6}$/.test(code)){$('msg').textContent='Digite os 6 dígitos.';return}busy=true;$('verify').disabled=true;$('msg').textContent='Validando…';try{const fs=await sb.auth.mfa.listFactors();if(fs.error)throw fs.error;const f=fs.data?.totp?.find(x=>x.status==='verified');if(!f)throw new Error('Autenticador verificado não encontrado.');const ch=await sb.auth.mfa.challenge({factorId:f.id});if(ch.error)throw ch.error;const vr=await sb.auth.mfa.verify({factorId:f.id,challengeId:ch.data.id,code});if(vr.error)throw vr.error;await sb.auth.refreshSession();const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.data?.currentLevel!=='aal2')throw new Error('A sessão ainda não foi promovida para AAL2.');$('msg').className='msg ok';$('msg').textContent='MFA confirmado. Abrindo painel…';setTimeout(()=>location.replace('./?v=48&mfa=ok'),250)}catch(err){$('msg').textContent=err?.message||'Falha ao validar código.';$('code').select();$('code').focus()}finally{busy=false;$('verify').disabled=false}};$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('login-v48.html?v=48')};init()})();</script></body></html>
