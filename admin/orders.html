<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Pedidos — Geladinho dos Sonhos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>:root{--p:#ff0f68;--p2:#ff4e8e;--w:#4a101e;--line:#efdde4;--muted:#78616a;--g:#19b15b;--red:#c9364d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#fff8fb;color:#29171d}.wrap{max-width:1120px;margin:auto;padding:14px}.head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;margin:-14px -14px 14px;padding:14px;background:#fffafcee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head h1{margin:0;color:var(--w);font-size:24px}.head small{display:block;color:var(--muted);font-size:11px}.head button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:850}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button,.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;color:var(--w)}.tabs button.on,.filters button.on{background:var(--p);color:#fff;border-color:var(--p)}.filters{display:none}.filters.show{display:flex}.custom{display:none;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.custom.show{display:flex}.custom label{font-size:11px;color:var(--muted);font-weight:800}.custom input{display:block;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px}.custom button{border:0;background:var(--w);color:#fff;border-radius:10px;padding:10px 13px;font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.sum small{color:var(--muted);font-size:11px}.sum b{display:block;font-size:22px;color:var(--w);margin-top:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.order{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 14px 34px rgba(99,23,51,.08);overflow:hidden}.order.new{border:2px solid var(--p);box-shadow:0 18px 42px rgba(255,15,104,.18)}.stamp{position:absolute;right:13px;top:43px;border:3px solid currentColor;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:1000;letter-spacing:.08em;transform:rotate(-7deg);opacity:.78;pointer-events:none}.stamp.approved{color:#16814a}.stamp.finalized{color:#4a101e}.stamp.cancelled{color:#c9364d}.topline{display:flex;gap:8px;align-items:flex-start}.tag{display:inline-flex;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:950}.statusTag{margin-left:auto;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:900;background:#f7eff2;color:#6e4050}.order h3{margin:10px 0 4px;color:#3e1220;font-size:18px;padding-right:90px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.pill{background:#fff4f7;border:1px solid #f5d9e3;border-radius:99px;padding:5px 8px;font-size:12px;font-weight:800}.price{color:var(--p);font-weight:950}.contact{display:grid;gap:7px;margin:10px 0}.contact a,.contact div{display:flex;align-items:flex-start;gap:7px;text-decoration:none;color:#4c313a;font-size:13px;background:#fffafd;border:1px solid #f4e3e9;border-radius:12px;padding:9px 10px}.items{background:#fff7fa;border:1px solid #f3e1e7;border-radius:14px;padding:10px;margin:10px 0}.itemsTitle{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900;margin-bottom:6px}.item{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dashed #f0dfe5}.item:last-child{border-bottom:0}.notes,.cancelReason{font-size:12px;border-radius:12px;padding:9px;margin:9px 0}.notes{color:#6c5660;background:#fff8ed;border:1px solid #f6e1bc}.cancelReason{color:#971f36;background:#fff0f3;border:1px solid #f1b8c5;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 9px;font-weight:950;font-size:13px}.accept{background:var(--g);color:#fff}.reject{background:#ffe8ed;color:#a51f3a}.prepare{background:#fff0d8;color:#945a00}.dispatch{background:#e8f1ff;color:#215d9c}.finish{background:#e5f8ec;color:#14753e}.archive{background:#3f1630;color:#fff}.back{background:#f3edf0;color:#694653}.more{margin-top:9px}.more select{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.history{display:grid;gap:7px}.historyRow{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:105px 110px minmax(150px,1fr) 100px 120px 32px;gap:9px;align-items:center;box-shadow:0 5px 16px rgba(99,23,51,.04)}.historyRow.cancel{border-left:4px solid var(--red)}.historyRow.final{border-left:4px solid var(--g)}.hdate{font-size:11px;color:var(--muted)}.hcode{font-weight:950;color:var(--w)}.hname{font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.htotal{font-weight:950;color:var(--p)}.hst{font-size:10px;font-weight:950;letter-spacing:.05em;text-align:center;border:2px solid currentColor;border-radius:6px;padding:4px;transform:rotate(-2deg)}.hst.final{color:#367a50}.hst.cancel{color:#b72b46}.expand{border:0;background:#f8eef2;border-radius:8px;width:30px;height:30px;font-weight:900}.historyDetail{display:none;grid-column:1/-1;border-top:1px solid #f2e5ea;padding-top:9px}.historyRow.open .historyDetail{display:block}.histItems{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}.histItems span{font-size:11px;background:#fff5f8;border:1px solid #f3dce4;border-radius:99px;padding:4px 7px}.empty{text-align:center;color:var(--muted);padding:45px}.warn{background:#fff0f5;border:1px solid #ffc9db;padding:14px;border-radius:14px}.updated{font-size:11px;color:var(--muted);text-align:right;margin:8px 2px 0}@media(max-width:820px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.historyRow{grid-template-columns:80px 90px 1fr 82px 30px}.historyRow .hst{grid-column:3/5;justify-self:start}.historyRow .htotal{grid-column:4}.historyRow .expand{grid-column:5;grid-row:1}}@media(max-width:560px){.wrap{padding:10px}.head{margin:-10px -10px 10px;padding:10px}.actions{grid-template-columns:1fr 1fr}.tabs button{flex:1}.filters{display:none!important}.filters.show{display:grid!important;grid-template-columns:repeat(2,1fr)}.historyRow{grid-template-columns:72px 78px 1fr 30px;padding:9px}.historyRow .htotal{grid-column:3}.historyRow .hst{grid-column:2/4}.historyRow .expand{grid-column:4;grid-row:1}.order h3{padding-right:75px}.stamp{right:8px;font-size:10px}}</style></head><body><div class="wrap"><div class="head"><div><h1>Pedidos</h1><small>Geladinho dos Sonhos</small></div><button id="notify">🔔 Notificações</button></div><div id="msg"></div><div class="tabs"><button id="tabOpen" class="on">Pedidos em aberto</button><button id="tabClosed">Histórico</button></div><div id="filters" class="filters"><button data-p="today" class="on">Hoje</button><button data-p="7">7 dias</button><button data-p="30">30 dias</button><button data-p="month">Este mês</button><button data-p="all">Todos</button><button data-p="custom">Período</button></div><div id="custom" class="custom"><label>De<input id="from" type="date"></label><label>Até<input id="to" type="date"></label><button id="apply">Aplicar</button></div><div id="summary" class="summary"></div><div id="grid" class="grid"></div><div id="history" class="history" style="display:none"></div><div id="updated" class="updated"></div></div><script>const {createClient}=supabase,sb=createClient('https://qpqruhcspbdxjcnbhdhn.supabase.co','sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk'),$=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let seen=new Set(),ready=false,allOrders=[],view='open',period='today',customRange=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function admin(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {data}=await sb.from('admin_users').select('user_id').maybeSingle();return !!data}function address(o){if(o.fulfillment!=='entrega'||!o.address)return'Retirada no local';const a=o.address;return`${a.street||''}, ${a.number||''}${a.complement?' · '+a.complement:''} · ${a.district||''}${a.reference?' · Ref.: '+a.reference:''}`}function ping(o){try{if(Notification.permission==='granted')new Notification('Novo pedido #'+o.public_code,{body:o.customer_name+' · '+money(o.total),icon:'../assets/icon-192.png'})}catch(_){}}function stamp(o){if(o.status==='Finalizado')return'<span class="stamp finalized">FINALIZADO</span>';if(o.status==='Cancelado')return'<span class="stamp cancelled">CANCELADO</span>';if(['Aceito','Em preparação','Saiu para entrega','Entregue'].includes(o.status))return'<span class="stamp approved">APROVADO</span>';return''}function nextButtons(o){if(o.status==='Pedido recebido')return`<button class="accept" onclick="setStatus('${o.id}','Aceito')">✓ Aceitar</button><button class="reject" onclick="setStatus('${o.id}','Cancelado')">✕ Recusar</button>`;if(o.status==='Aceito')return`<button class="prepare" onclick="setStatus('${o.id}','Em preparação')">👩‍🍳 Iniciar preparo</button><button class="back" onclick="setStatus('${o.id}','Cancelado')">Cancelar</button>`;if(o.status==='Em preparação'&&o.fulfillment==='entrega')return`<button class="dispatch" onclick="setStatus('${o.id}','Saiu para entrega')">🛵 Saiu p/ entrega</button><button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Entregue</button>`;if(o.status==='Em preparação')return`<button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Pronto/Entregue</button><button class="back" onclick="setStatus('${o.id}','Cancelado')">Cancelar</button>`;if(o.status==='Saiu para entrega')return`<button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Marcar entregue</button><button class="back" onclick="setStatus('${o.id}','Em preparação')">↶ Voltar</button>`;if(o.status==='Entregue')return`<button class="archive" onclick="setStatus('${o.id}','Finalizado')">✓ Finalizar pedido</button><button class="back" onclick="setStatus('${o.id}','Em preparação')">↶ Reabrir</button>`;return`<button class="back" onclick="setStatus('${o.id}','Pedido recebido')">↶ Reabrir pedido</button>`}function summary(orders){const novo=orders.filter(o=>o.status==='Pedido recebido').length,prep=orders.filter(o=>['Aceito','Em preparação'].includes(o.status)).length,rota=orders.filter(o=>o.status==='Saiu para entrega').length,entregues=orders.filter(o=>o.status==='Entregue').length;$('summary').innerHTML=`<div class="sum"><small>Novos</small><b>${novo}</b></div><div class="sum"><small>Preparando</small><b>${prep}</b></div><div class="sum"><small>Na rua</small><b>${rota}</b></div><div class="sum"><small>Aguardando finalizar</small><b>${entregues}</b></div>`}function dateRange(){const now=new Date(),end=new Date(now);end.setHours(23,59,59,999);const start=new Date(now);start.setHours(0,0,0,0);if(period==='today')return[start,end];if(period==='7'){start.setDate(start.getDate()-6);return[start,end]}if(period==='30'){start.setDate(start.getDate()-29);return[start,end]}if(period==='month')return[new Date(now.getFullYear(),now.getMonth(),1),end];if(period==='custom'&&customRange)return customRange;return null}function historyOrders(){let x=allOrders.filter(o=>['Finalizado','Cancelado'].includes(o.status));const r=dateRange();if(r)x=x.filter(o=>{const d=new Date(o.updated_at||o.created_at);return d>=r[0]&&d<=r[1]});return x}async function load(){if(!await admin()){$('msg').innerHTML='<div class="warn">Entre primeiro na aba <b>Produtos / Estoque</b> com sua conta.</div>';$('grid').innerHTML='';$('summary').innerHTML='';return}const {data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(1000);if(error){$('msg').textContent=error.message;return}allOrders=data||[];if(ready)allOrders.filter(o=>o.status==='Pedido recebido'&&!seen.has(o.id)).forEach(ping);allOrders.forEach(o=>seen.add(o.id));ready=true;summary(allOrders.filter(o=>!['Finalizado','Cancelado'].includes(o.status)));render();$('updated').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}function openCard(o){const st=['Pedido recebido','Aceito','Em preparação','Saiu para entrega','Entregue','Finalizado','Cancelado'];return`<article class="order ${o.status==='Pedido recebido'?'new':''}">${stamp(o)}<div class="topline">${o.status==='Pedido recebido'?'<span class="tag">🔔 NOVO PEDIDO</span>':''}<span class="statusTag">${esc(o.status)}</span></div><h3>#${esc(o.public_code)} · ${esc(o.customer_name)}</h3><div class="meta"><span class="pill price">${money(o.total)}</span><span class="pill">${o.fulfillment==='entrega'?'🛵 Entrega':'🏠 Retirada'}</span></div><div class="contact"><a href="tel:${esc(o.customer_phone||'')}">📱 ${esc(o.customer_phone||'Sem telefone')}</a><div>${o.fulfillment==='entrega'?'📍':'🏠'} ${esc(address(o))}</div></div>${o.notes?`<div class="notes">📝 ${esc(o.notes)}</div>`:''}${o.cancel_reason?`<div class="cancelReason">✕ Motivo: ${esc(o.cancel_reason)}</div>`:''}<div class="items"><div class="itemsTitle">Itens do pedido</div>${(o.order_items||[]).map(i=>`<div class="item"><span><b>${i.quantity}x</b> ${esc(i.product_name)}</span><b>${money(Number(i.unit_price)*i.quantity)}</b></div>`).join('')}</div><div class="actions">${nextButtons(o)}</div><div class="more"><select onchange="setStatus('${o.id}',this.value)">${st.map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></div></article>`}function historyRow(o){const fin=o.status==='Finalizado',cls=fin?'final':'cancel',when=new Date(o.updated_at||o.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});return`<div class="historyRow ${cls}" id="h${o.id}"><div class="hdate">${when}</div><div class="hcode">#${esc(o.public_code)}</div><div class="hname">${esc(o.customer_name)}</div><div class="htotal">${money(o.total)}</div><div class="hst ${cls}">${fin?'FINALIZADO':'CANCELADO'}</div><button class="expand" onclick="document.getElementById('h${o.id}').classList.toggle('open')">⌄</button><div class="historyDetail"><div><b>${o.fulfillment==='entrega'?'🛵 Entrega':'🏠 Retirada'}</b> · ${esc(o.customer_phone||'')}</div>${o.cancel_reason?`<div class="cancelReason">✕ Motivo do cancelamento: ${esc(o.cancel_reason)}</div>`:''}<div class="histItems">${(o.order_items||[]).map(i=>`<span>${i.quantity}x ${esc(i.product_name)}</span>`).join('')}</div><small>${esc(address(o))}</small></div></div>`}function render(){const isOpen=view==='open';$('grid').style.display=isOpen?'grid':'none';$('history').style.display=isOpen?'none':'grid';$('summary').style.display=isOpen?'grid':'none';$('filters').classList.toggle('show',!isOpen);$('custom').classList.toggle('show',!isOpen&&period==='custom');if(isOpen){const orders=allOrders.filter(o=>!['Finalizado','Cancelado'].includes(o.status));$('grid').innerHTML=orders.length?orders.map(openCard).join(''):'<div class="empty">Nenhum pedido em aberto.</div>'}else{const orders=historyOrders();$('history').innerHTML=orders.length?orders.map(historyRow).join(''):'<div class="empty">Nenhum pedido neste período.</div>'}}window.setStatus=async(id,status)=>{const o=allOrders.find(x=>x.id===id),patch={status};if(status==='Cancelado'){const reason=prompt('Informe o motivo do cancelamento/recusa.\nEx.: Produto sem estoque');if(!reason||!reason.trim()){render();return alert('O motivo do cancelamento é obrigatório.')}patch.cancel_reason=reason.trim()}else if(o&&o.status==='Cancelado')patch.cancel_reason=null;const {error}=await sb.from('orders').update(patch).eq('id',id);if(error)return alert(error.message);await load()};$('tabOpen').onclick=()=>{view='open';$('tabOpen').classList.add('on');$('tabClosed').classList.remove('on');render()};$('tabClosed').onclick=()=>{view='closed';$('tabClosed').classList.add('on');$('tabOpen').classList.remove('on');render()};document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');period=b.dataset.p;render()});$('apply').onclick=()=>{if(!$('from').value||!$('to').value)return alert('Escolha as duas datas.');const a=new Date($('from').value+'T00:00:00'),b=new Date($('to').value+'T23:59:59');if(a>b)return alert('Período inválido.');customRange=[a,b];render()};$('notify').onclick=async()=>{if(!('Notification'in window))return alert('Notificações indisponíveis neste navegador.');const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'🔔 Ativas':'🔕 Bloqueadas'};load();setInterval(load,8000);</script></body></html>
