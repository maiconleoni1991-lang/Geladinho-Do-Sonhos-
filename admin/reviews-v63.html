<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><meta name="robots" content="noindex,nofollow,noarchive"><title>Depoimentos — GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1100px;margin:auto;padding:16px 12px 70px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900}.msg{margin:12px 0;padding:11px;background:#fff;border:1px solid #efdde4;border-radius:11px;color:#78616a}.ok{color:#14753e}.err{color:#b02a42}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat,.card{background:#fff;border:1px solid #efdde4;border-radius:17px;padding:14px}.stat small{color:#78616a}.stat b{display:block;font-size:25px;color:#4a101e}.section{margin-top:18px}.section h2{color:#4a101e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stars{color:#ffb400;letter-spacing:2px;font-size:19px}.meta{font-size:12px;color:#78616a;margin:5px 0}.comment{line-height:1.5;background:#fff7fa;border-radius:12px;padding:10px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:1px solid #efdde4;background:#fff;border-radius:9px;padding:8px 10px;font-weight:850}.actions .on{background:#eaf8ef;color:#14753e;border-color:#bee5cd}.actions .wa{background:#eaf8ef;color:#08773d}.empty{padding:26px;text-align:center;color:#78616a;background:#fff;border:1px dashed #efdde4;border-radius:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><script src="admin-common-v48.js?v=65"></script><main class="wrap"><div class="head"><div><h1>⭐ Depoimentos / Avaliações</h1><div style="font-size:12px;color:#78616a">Acompanhe avaliações, publique depoimentos e peça feedback pelo WhatsApp</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button></div><div id="msg" class="msg">Carregando avaliações…</div><section class="stats"><div class="stat"><small>Avaliações recebidas</small><b id="sReviews">—</b></div><div class="stat"><small>Depoimentos publicados</small><b id="sPublic">—</b></div><div class="stat"><small>Aguardando avaliação</small><b id="sPending">—</b></div></section><section class="section"><h2>Aguardando avaliação</h2><div id="pending" class="grid"></div></section><section class="section"><h2>Avaliações recebidas</h2><div id="reviews" class="grid"></div></section></main><script>
(async()=>{const $=x=>document.getElementById(x);let reviews=[],published=[],orders=[];function setMsg(t,c=''){$('msg').textContent=t;$('msg').className='msg '+c}function phoneWa(v){let p=String(v||'').replace(/\D/g,'');if(!p)return'';if(!p.startsWith('55'))p='55'+p;return p}function track(o){return new URL('../acompanhar/?t='+encodeURIComponent(o.tracking_token),location.href).href}function ask(o){const p=phoneWa(o.customer_phone);if(!p)return alert('Este pedido não possui WhatsApp válido.');const msg=`Olá, ${o.customer_name}! 💗 Esperamos que tenha gostado do seu pedido ${o.public_code} do *Geladinho dos Sonhos*.

Sua opinião é muito importante para nós. Você pode avaliar seu pedido de 1 a 5 estrelas e deixar um comentário neste link:
${track(o)}

Obrigado por escolher o Geladinho dos Sonhos! 🍧✨`;window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank','noopener')}window.askReview=ask;
async function load(){setMsg('Carregando avaliações…');const [r,p,o]=await Promise.all([GDS48.sb.from('reviews').select('*').order('created_at',{ascending:false}),GDS48.sb.from('public_testimonials').select('*'),GDS48.sb.from('orders').select('id,public_code,tracking_token,customer_name,customer_phone,status,created_at').in('status',['Entregue','Finalizado']).order('created_at',{ascending:false})]);if(r.error||p.error||o.error){setMsg((r.error||p.error||o.error).message,'err');return}reviews=r.data||[];published=p.data||[];orders=o.data||[];render();setMsg('🟢 Avaliações e depoimentos atualizados','ok')}
function render(){const reviewed=new Set(reviews.map(x=>x.order_id)),pub=new Set(published.map(x=>x.review_id)),pending=orders.filter(o=>!reviewed.has(o.id));$('sReviews').textContent=reviews.length;$('sPublic').textContent=published.length;$('sPending').textContent=pending.length;$('pending').innerHTML=pending.length?pending.map(o=>`<article class="card"><b>${GDS48.esc(o.public_code)} · ${GDS48.esc(o.customer_name)}</b><div class="meta">${GDS48.esc(o.status)} · ${new Date(o.created_at).toLocaleString('pt-BR')}</div><div class="actions"><button class="wa" onclick="askReview('${o.id}')">💬 Pedir avaliação no WhatsApp</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Nenhum pedido concluído aguardando avaliação.</div>';$('reviews').innerHTML=reviews.length?reviews.map(r=>{const o=orders.find(x=>x.id===r.order_id),isPub=pub.has(r.id);return `<article class="card"><div class="stars">${'★'.repeat(Number(r.rating)||0)}${'☆'.repeat(5-(Number(r.rating)||0))}</div><b>${GDS48.esc(o?.public_code||'Pedido')} · ${GDS48.esc(o?.customer_name||'Cliente')}</b><div class="meta">${new Date(r.created_at).toLocaleString('pt-BR')}</div><div class="comment">${GDS48.esc(r.comment||'Avaliação sem comentário.')}</div><div class="actions"><button class="${isPub?'on':''}" onclick="togglePub(${r.id})">${isPub?'✅ Publicado — ocultar':'Publicar como depoimento'}</button>${o?`<button class="wa" onclick="askReview('${o.id}')">💬 WhatsApp</button>`:''}</div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1">Ainda não há avaliações recebidas.</div>'}
window.askReview=id=>{const o=orders.find(x=>x.id===id);if(o)ask(o)};
window.togglePub=async id=>{const r=reviews.find(x=>x.id===id);if(!r?.comment)return alert('Avaliações sem comentário não podem virar depoimento.');const existing=published.find(x=>x.review_id===id);setMsg(existing?'Ocultando depoimento…':'Publicando depoimento…');let error;if(existing)({error}=await GDS48.sb.from('public_testimonials').delete().eq('review_id',id));else({error}=await GDS48.sb.from('public_testimonials').insert({review_id:r.id,rating:r.rating,comment:r.comment,created_at:r.created_at}));if(error){setMsg(error.message,'err');return}await load()};
$('refresh').onclick=load;try{await GDS48.ensure('reviews');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message,'err')}})();
</script></body></html>
