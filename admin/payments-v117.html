<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><meta name="robots" content="noindex,nofollow,noarchive"><title>Pagamentos — GDS Admin v117</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1080px;margin:auto;padding:16px 12px 70px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900;cursor:pointer}.msg{margin:12px 0;padding:10px 12px;border:1px solid #efdde4;background:#fff;border-radius:11px;color:#78616a}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.filters button{border:1px solid #efdde4;background:#fff;border-radius:99px;padding:8px 11px;font-weight:900}.filters button.on{background:#ff0f68;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid #efdde4;border-radius:17px;padding:14px}.top{display:flex;gap:8px;align-items:center}.code{font-weight:950;color:#4a101e}.customer{font-weight:800}.status{margin-left:auto;font-size:11px;font-weight:950;padding:4px 7px;border-radius:99px}.status.Pendente{background:#fff4d7;color:#815d00}.status.Parcial{background:#fff0f5;color:#a42b50}.status.Pago{background:#eaf8ef;color:#14753e}.meta{font-size:12px;color:#78616a;margin-top:5px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.num{padding:9px;border:1px solid #f0e1e7;border-radius:11px;background:#fffafc}.num small{display:block;color:#78616a;font-size:10px}.num b{display:block;margin-top:3px;color:#4a101e}.num.remaining b{color:#ff0f68}.edit{border-top:1px solid #f3e5ea;padding-top:10px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.field label{display:block;font-size:10px;font-weight:900;color:#78616a;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #efdde4;border-radius:10px;padding:10px;background:#fff}.save{background:#ff0f68;color:#fff;border-color:#ff0f68}.empty{padding:30px;text-align:center;color:#78616a}@media(max-width:760px){.grid{grid-template-columns:1fr}.edit{grid-template-columns:1fr 1fr}.edit .save{grid-column:1/-1}.numbers{grid-template-columns:1fr 1fr 1fr}}@media(max-width:460px){.edit{grid-template-columns:1fr}.edit .save{grid-column:auto}.numbers{grid-template-columns:1fr}}</style></head><body><script src="admin-common-v48.js?v=138"></script><main class="wrap"><div class="head"><div><h1>💰 Pagamentos</h1><div style="font-size:12px;color:#78616a">Edite pagamentos parciais e veja o saldo restante.</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button></div><div id="msg" class="msg">Carregando pagamentos…</div><div class="filters"><button data-f="open" class="on">Pendentes / Parciais</button><button data-f="local">Todas vendas locais</button><button data-f="all">Todos</button></div><div id="grid" class="grid"></div></main><script>
(async()=>{const $=id=>document.getElementById(id);let orders=[],filter='open';
function money(v){return GDS48.money(v)}
function remaining(o){return Math.max(0,Number(o.total||0)-Number(o.paid_amount||0))}
function list(){if(filter==='open')return orders.filter(o=>o.payment_status!=='Pago');if(filter==='local')return orders.filter(o=>o.sales_channel==='local');return orders}
function render(){
 const rows=list();
 $('grid').innerHTML=rows.length?rows.map(o=>'<article class="card"><div class="top"><span class="code">'+GDS48.esc(o.public_code)+'</span><span class="customer">'+GDS48.esc(o.customer_name||'')+'</span><span class="status '+GDS48.esc(o.payment_status||'Pendente')+'">'+GDS48.esc(o.payment_status||'Pendente')+'</span></div><div class="meta">'+new Date(o.created_at).toLocaleString('pt-BR')+' · '+(o.sales_channel==='local'?'🏠 Venda local':'🌐 Online')+' · '+GDS48.esc(o.payment_method||'Não informado')+'</div><div class="numbers"><div class="num"><small>TOTAL</small><b>'+money(o.total)+'</b></div><div class="num"><small>JÁ PAGO</small><b>'+money(o.paid_amount)+'</b></div><div class="num remaining"><small>RESTANTE</small><b>'+money(remaining(o))+'</b></div></div><div class="edit"><div class="field"><label>VALOR TOTAL JÁ PAGO</label><input id="amt-'+o.id+'" type="number" min="0" max="'+Number(o.total||0).toFixed(2)+'" step="0.01" value="'+Number(o.paid_amount||0).toFixed(2)+'"></div><div class="field"><label>FORMA DE PAGAMENTO</label><select id="method-'+o.id+'"><option '+(o.payment_method==='Pix'?'selected':'')+'>Pix</option><option '+(o.payment_method==='Dinheiro'?'selected':'')+'>Dinheiro</option><option '+(o.payment_method==='Fiado'?'selected':'')+'>Fiado</option></select></div><button class="btn save" onclick="savePay(\''+o.id+'\')">Salvar pagamento</button></div></article>').join(''):'<div class="empty">Nenhum pagamento nesta visualização.</div>'
}
async function load(){
 $('msg').textContent='Carregando pagamentos…';
 const {data,error}=await GDS48.sb.from('orders').select('id,public_code,customer_name,total,paid_amount,payment_status,payment_method,sales_channel,created_at,deleted_at').is('deleted_at',null).order('created_at',{ascending:false}).limit(300);
 if(error){$('msg').textContent='Erro: '+error.message;return}
 orders=data||[];render();$('msg').textContent='🟢 '+orders.length+' ordens carregadas.'
}
window.savePay=async id=>{
 const o=orders.find(x=>x.id===id);if(!o)return;
 const amount=Math.max(0,Math.min(Number($('amt-'+id).value)||0,Number(o.total)||0));
 const method=$('method-'+id).value;
 if(!confirm('Salvar pagamento de '+money(amount)+' já recebido em '+method+'?\n\nSaldo restante: '+money(Number(o.total)-amount)))return;
 const {error}=await GDS48.sb.rpc('set_order_payment_v117',{p_order_id:id,p_paid_amount:amount,p_payment_method:method});
 if(error)return alert(error.message);
 await load()
};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});
$('refresh').onclick=load;
try{await GDS48.ensure('payments');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))$('msg').textContent='Erro: '+err.message}
})();</script></body></html>
