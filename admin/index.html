<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff0f68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GDS Admin">
<link rel="manifest" href="./manifest.webmanifest?v=44">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=44">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png?v=44">
<title>Geladinho dos Sonhos — Administração</title>
<style>
:root{--p:#ff0f68;--w:#4a101e;--line:#efdde4;--muted:#78616a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#fff8fb;color:#29171d;touch-action:manipulation}
body{display:flex;flex-direction:column}
button,a,input,select,textarea{touch-action:manipulation}
.bar{background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:100}
.top{max-width:1180px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.logo{width:52px;height:52px;object-fit:contain;object-position:center}
.brand b{display:block;color:var(--w)}.brand small{color:var(--muted)}
.tabs{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--w);padding:10px 12px;border-radius:12px;font-weight:850;cursor:pointer;min-height:44px;position:relative;z-index:110}
.tabs button.on{background:var(--p);color:#fff}
.refresh{display:none!important}.refresh.show{display:block!important}
.stage{position:relative;flex:1;min-height:0;z-index:1}
.view{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff;pointer-events:auto}
.view.on{display:block}
@media(max-width:800px){.top{flex-wrap:wrap}.brand{flex:1}.tabs{order:3;width:100%;margin:0;display:grid;grid-template-columns:1fr 1fr}.tabs button{font-size:11px;padding:10px 7px}}
</style>
</head>
<body>
<div class="bar"><div class="top">
  <img class="logo" src="../assets/logo-oficial.webp?v=44" alt="Geladinho dos Sonhos">
  <div class="brand"><b>Geladinho dos Sonhos</b><small>Painel administrativo</small></div>
  <div class="tabs">
    <button id="adminTab" class="on" type="button">⚙️ Produtos / Estoque</button>
    <button id="ordersTab" type="button">🔔 Pedidos</button>
    <button id="eventsTab" type="button">🎉 Festas / Eventos</button>
    <button id="reportsTab" type="button">📊 Relatórios</button>
    <button id="clientTab" type="button">👁️ Loja</button>
    <button id="refreshBtn" class="refresh" type="button">↻ Atualizar</button>
  </div>
</div></div>
<div class="stage">
  <iframe id="adminFrame" class="view on" src="manage.html?v=44" title="Produtos e estoque"></iframe>
  <iframe id="ordersFrame" class="view" src="orders-v30.html?v=44" title="Pedidos"></iframe>
  <iframe id="eventsFrame" class="view" src="events-v41.html?v=44" title="Festas e eventos"></iframe>
  <iframe id="reportsFrame" class="view" src="reports-v30.html?v=44" title="Relatórios"></iframe>
  <iframe id="clientFrame" class="view" src="../?preview=1&v=44" title="Loja"></iframe>
</div>
<script>
(()=>{
  const a=document.getElementById('adminFrame'),o=document.getElementById('ordersFrame'),ev=document.getElementById('eventsFrame'),r=document.getElementById('reportsFrame'),c=document.getElementById('clientFrame');
  const adminTab=document.getElementById('adminTab'),ordersTab=document.getElementById('ordersTab'),eventsTab=document.getElementById('eventsTab'),reportsTab=document.getElementById('reportsTab'),clientTab=document.getElementById('clientTab'),refreshBtn=document.getElementById('refreshBtn');
  const frames={admin:a,orders:o,events:ev,reports:r,client:c},tabs={admin:adminTab,orders:ordersTab,events:eventsTab,reports:reportsTab,client:clientTab};
  function pv(){c.src='../?preview=1&v=44&t='+Date.now()}
  function cleanManage(){try{const d=a.contentDocument;if(!d)return;const oldOrders=d.querySelector('[data-panel="orders"]');if(oldOrders)oldOrders.style.display='none';const oldPanel=d.getElementById('orders');if(oldPanel)oldPanel.style.display='none';const oldCount=d.getElementById('sOrders');if(oldCount){const card=oldCount.closest('.stat');if(card)card.style.display='none'}const grid=d.querySelector('.grid4');if(grid)grid.style.gridTemplateColumns='repeat(auto-fit,minmax(180px,1fr))'}catch(_){}}
  function secureManage(){try{const d=a.contentDocument;if(!d||!d.body||d.getElementById('gdsAdminSecurityV36'))return;const s=d.createElement('script');s.id='gdsAdminSecurityV36';s.src='../admin-security-v36.js?v=44';d.body.appendChild(s)}catch(_){}}
  function show(name){Object.entries(frames).forEach(([k,f])=>f.classList.toggle('on',k===name));Object.entries(tabs).forEach(([k,b])=>b.classList.toggle('on',k===name));refreshBtn.classList.toggle('show',name==='client');if(name==='client')pv();if(name==='orders')o.src='orders-v30.html?v=44&t='+Date.now();if(name==='events')ev.src='events-v41.html?v=44&t='+Date.now();if(name==='reports')r.src='reports-v30.html?v=44&t='+Date.now();if(name==='admin')setTimeout(()=>{cleanManage();secureManage()},80)}
  a.addEventListener('load',()=>{cleanManage();secureManage()});
  adminTab.addEventListener('click',()=>show('admin'));ordersTab.addEventListener('click',()=>show('orders'));eventsTab.addEventListener('click',()=>show('events'));reportsTab.addEventListener('click',()=>show('reports'));clientTab.addEventListener('click',()=>show('client'));refreshBtn.addEventListener('click',pv);
})();
</script>
<script src="../admin-touch-fix-v44.js?v=44"></script>
<script src="../brand-fix-v42.js?v=44"></script>
<script src="../admin-products-v32.js?v=44"></script>
<script src="../admin-images-v34.js?v=44"></script>
<script src="../admin-product-sort-v35.js?v=44"></script>
<script src="../admin-price-fix-v38.js?v=44"></script>
<script src="../admin-live-v39.js?v=44"></script>
</body>
</html>
