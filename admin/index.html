<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><link rel="manifest" href="./manifest.webmanifest?v=71"><title>GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1180px;margin:auto;padding:18px 14px 70px}.hero{background:linear-gradient(135deg,#4a101e,#7f1f49);color:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 45px #4a101e24}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#ffe7f0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat,.card{background:#fff;border:1px solid #efdde4;border-radius:18px;padding:16px;box-shadow:0 12px 30px #4a101e0d}.stat small{color:#78616a}.stat b{display:block;font-size:28px;color:#4a101e;margin-top:5px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick a{text-decoration:none;color:#4a101e;font-weight:900;min-height:95px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:14px}.quick span{font-size:27px;margin-bottom:6px}.msg{margin-top:14px;padding:12px;border-radius:12px;background:#fff;border:1px solid #efdde4;color:#78616a}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}}@media(max-width:430px){.stats{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}}</style></head><body><script src="admin-common-v48.js?v=71"></script><main class="wrap"><section class="hero"><img src="/Geladinho-Do-Sonhos-/assets/logo-oficial-hq-v65.webp?v=71" alt="Geladinho dos Sonhos" onerror="this.onerror=null;this.src='/Geladinho-Do-Sonhos-/assets/icon-512.png?v=71'" style="width:220px;max-width:70vw;height:auto;display:block;margin:0 0 14px"><h1>Painel administrativo</h1><p>Estoque, pedidos, eventos e relatórios em uma sessão MFA única.</p></section><section class="stats"><div class="stat"><small>Produtos</small><b id="products">—</b></div><div class="stat"><small>Itens em estoque</small><b id="stock">—</b></div><div class="stat"><small>Pedidos abertos</small><b id="orders">—</b></div><div class="stat"><small>Eventos ativos</small><b id="events">—</b></div></section><section class="quick"><a class="card" href="products-v48.html?v=71"><span>⚙️</span>Produtos / Estoque</a><a class="card" href="orders-v48.html?v=71"><span>🔔</span>Pedidos / Abrir Loja</a><a class="card" href="events-v57.html?v=71"><span>🎉</span>Festas / Eventos</a><a class="card" href="reports-v48.html?v=71"><span>📊</span>Relatórios</a><a class="card" href="reviews-v63.html?v=71"><span>⭐</span>Depoimentos / Avaliações</a><a class="card" href="../?v=71"><span>👁️</span>Visualizar Loja</a><button id="logout" class="card" style="border:1px solid #efdde4;font:900 14px Inter;background:#fff"><span style="font-size:27px">🚪</span>Sair</button></section><div id="msg" class="msg">Carregando dados do painel…</div></main><script>(async()=>{const $=x=>document.getElementById(x);try{await GDS48.ensure('home');const sb=GDS48.sb;const [p,o,e]=await Promise.all([sb.from('products').select('id,stock,active'),sb.from('orders').select('id,status'),sb.from('events').select('id,status')]);if(p.error)throw p.error;if(o.error)throw o.error;if(e.error)throw e.error;const products=p.data||[],orders=o.data||[],events=e.data||[];$('products').textContent=products.length;$('stock').textContent=products.reduce((n,x)=>n+(Number(x.stock)||0),0);$('orders').textContent=orders.filter(x=>!['Finalizado','Cancelado','Entregue'].includes(x.status)).length;$('events').textContent=events.filter(x=>!['Concluído','Cancelado'].includes(x.status)).length;$('msg').textContent='🟢 Supabase conectado · MFA confirmado · dados carregados';$('msg').style.color='#14753e'}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message)){$('msg').textContent='Erro ao carregar painel: '+err.message;$('msg').style.color='#b02a42'}}$('logout').onclick=GDS48.logout})();</script></body></html>
