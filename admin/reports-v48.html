<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Relatórios — GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1100px;margin:auto;padding:16px 12px 70px}.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900}.msg{margin:12px 0;padding:11px;background:#fff;border:1px solid #efdde4;border-radius:11px;color:#78616a}.ok{color:#14753e}.err{color:#b02a42}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.card{background:#fff;border:1px solid #efdde4;border-radius:17px;padding:14px}.stat small{color:#78616a}.stat b{display:block;font-size:25px;color:#4a101e;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.card h2{margin:0 0 10px;color:#4a101e;font-size:17px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f4e9ed;font-size:13px}.row:last-child{border-bottom:0}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:430px){.stats{grid-template-columns:1fr}}</style></head><body><script src="admin-common-v48.js?v=93"></script><main class="wrap"><div class="head"><div><h1>Relatórios</h1><div style="font-size:12px;color:#78616a">Resumo operacional e vendas</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button></div><div id="msg" class="msg">Carregando relatórios…</div><section class="stats"><div class="stat"><small>Estoque atual</small><b id="stock">—</b></div><div class="stat"><small>Pedidos</small><b id="orders">—</b></div><div class="stat"><small>Faturamento pedidos · 30 dias</small><b id="sales">—</b></div><div class="stat"><small>Encomendas eventos</small><b id="events">—</b></div></section><section class="grid"><div class="card"><h2>Estoque por categoria</h2><div id="cats"></div></div><div class="card"><h2>Pedidos por status</h2><div id="statuses"></div></div><div class="card"><h2>Eventos por status</h2><div id="eventStatuses"></div></div><div class="card"><h2>Valores</h2><div id="values"></div></div></section></main><script>(async()=>{const $=x=>document.getElementById(x);function setMsg(t,c=''){$('msg').textContent=t;$('msg').className='msg '+c}function rows(obj,fmt=v=>v){return Object.entries(obj).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([k,v])=>`<div class="row"><span>${GDS48.esc(k)}</span><b>${fmt(v)}</b></div>`).join('')}async function load(){setMsg('Carregando relatórios…');const [p,o,e]=await Promise.all([GDS48.sb.from('products').select('category,stock,active'),GDS48.sb.from('orders').select('status,total,created_at,archived_at'),GDS48.sb.from('events').select('status,subtotal,delivery_fee,event_date,payment_status')]);if(p.error||o.error||e.error){setMsg((p.error||o.error||e.error).message,'err');return}const ps=p.data||[],os=o.data||[],es=e.data||[];const cutoff=Date.now()-30*24*60*60*1000;const last30=os.filter(x=>new Date(x.created_at).getTime()>=cutoff);const validOrders=last30.filter(x=>x.status!=='Cancelado');const paidEvents=es.filter(x=>x.status!=='Cancelado'&&x.payment_status==='Pago');const pendingEvents=es.filter(x=>x.status!=='Cancelado'&&x.payment_status!=='Pago');$('stock').textContent=ps.reduce((n,x)=>n+(Number(x.stock)||0),0);$('orders').textContent=last30.length;$('sales').textContent=GDS48.money(validOrders.reduce((n,x)=>n+(Number(x.total)||0),0));$('events').textContent=es.length;const cats={};ps.forEach(x=>cats[x.category]=(cats[x.category]||0)+(Number(x.stock)||0));const st={};last30.forEach(x=>st[x.status]=(st[x.status]||0)+1);const est={};es.forEach(x=>est[x.status]=(est[x.status]||0)+1);$('cats').innerHTML=rows(cats);$('statuses').innerHTML=rows(st);$('eventStatuses').innerHTML=rows(est);const orderValue=validOrders.reduce((n,x)=>n+(Number(x.total)||0),0);const paidEventValue=paidEvents.reduce((n,x)=>n+(Number(x.subtotal)||0)+(Number(x.delivery_fee)||0),0);const pendingEventValue=pendingEvents.reduce((n,x)=>n+(Number(x.subtotal)||0)+(Number(x.delivery_fee)||0),0);$('values').innerHTML=rows({'Pedidos não cancelados · 30 dias':orderValue,'Eventos pagos · caixa':paidEventValue,'Eventos pendentes · fora do caixa':pendingEventValue,'Total contabilizado':orderValue+paidEventValue},GDS48.money);setMsg('🟢 Relatórios atualizados · eventos pendentes fora do caixa','ok')}$('refresh').onclick=load;try{await GDS48.ensure('reports');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message,'err')}})();</script></body></html>
