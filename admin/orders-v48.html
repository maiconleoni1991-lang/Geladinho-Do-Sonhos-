<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Pedidos — GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1100px;margin:auto;padding:16px 12px 70px}.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900}.msg{margin:12px 0;padding:11px;background:#fff;border:1px solid #efdde4;border-radius:11px;color:#78616a}.ok{color:#14753e}.err{color:#b02a42}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.filters button{border:1px solid #efdde4;background:#fff;border-radius:99px;padding:8px 11px;font-weight:900}.filters button.on{background:#ff0f68;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.order{background:#fff;border:1px solid #efdde4;border-radius:18px;padding:14px;box-shadow:0 12px 30px #4a101e0d}.top{display:flex;gap:8px;align-items:center}.code{font-weight:950;color:#4a101e}.price{margin-left:auto;color:#ff0f68;font-weight:950}.meta{font-size:12px;color:#78616a;margin-top:5px}.items{margin:10px 0;background:#fff7fa;border:1px solid #f1e0e7;border-radius:12px;padding:9px}.item{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0}.order select{width:100%;border:1px solid #efdde4;border-radius:10px;padding:9px;background:#fff;font-weight:800}.empty{padding:35px;text-align:center;color:#78616a}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><script src="admin-common-v48.js?v=48"></script><main class="wrap"><div class="head"><div><h1>Pedidos</h1><div style="font-size:12px;color:#78616a">Atualização de status em tempo real</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button></div><div id="msg" class="msg">Carregando pedidos…</div><div class="filters"><button data-f="open" class="on">Em aberto</button><button data-f="all">Todos</button><button data-f="done">Finalizados</button><button data-f="cancel">Cancelados</button></div><div id="grid" class="grid"></div></main><script>(async()=>{const $=x=>document.getElementById(x);let orders=[],filter='open';const statuses=['Pedido recebido','Aceito','Em preparação','Saiu para entrega','Entregue','Finalizado','Cancelado'];function setMsg(t,c=''){$('msg').textContent=t;$('msg').className='msg '+c}async function load(){setMsg('Carregando pedidos…');const {data,error}=await GDS48.sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(200);if(error){setMsg('Erro: '+error.message,'err');return}orders=data||[];render();setMsg(`🟢 ${orders.length} pedidos carregados`,'ok')}function list(){if(filter==='open')return orders.filter(o=>!['Finalizado','Cancelado','Entregue'].includes(o.status));if(filter==='done')return orders.filter(o=>['Finalizado','Entregue'].includes(o.status));if(filter==='cancel')return orders.filter(o=>o.status==='Cancelado');return orders}function render(){const a=list();$('grid').innerHTML=a.length?a.map(o=>`<article class="order"><div class="top"><span class="code">${GDS48.esc(o.public_code)}</span><span>${GDS48.esc(o.customer_name||'')}</span><span class="price">${GDS48.money(o.total)}</span></div><div class="meta">${new Date(o.created_at).toLocaleString('pt-BR')} · ${o.fulfillment==='entrega'?'Entrega':'Retirada'}</div><div class="items">${(o.order_items||[]).map(i=>`<div class="item"><span>${i.quantity}× ${GDS48.esc(i.product_name)}</span><b>${GDS48.money((Number(i.unit_price)||0)*(Number(i.quantity)||0))}</b></div>`).join('')||'<div class="item">Itens não disponíveis</div>'}</div><select onchange="setStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></article>`).join(''):'<div class="empty">Nenhum pedido nesta visualização.</div>'}window.setStatus=async(id,status)=>{setMsg('Atualizando pedido…');const {error}=await GDS48.sb.from('orders').update({status}).eq('id',id);if(error){setMsg('Erro: '+error.message,'err');await load();return}const o=orders.find(x=>x.id===id);if(o)o.status=status;render();setMsg('Pedido atualizado com sucesso.','ok')};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});$('refresh').onclick=load;try{await GDS48.ensure('orders');await load();GDS48.sb.channel('gds-orders-v48').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>load()).subscribe()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message,'err')}})();</script></body></html>
