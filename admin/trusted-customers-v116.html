<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><meta name="robots" content="noindex,nofollow,noarchive"><title>Clientes de confiança — GDS Admin v117</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1120px;margin:auto;padding:16px 12px 70px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:#ff0f68;color:#fff;border-color:#ff0f68}.panel{background:#fff;border:1px solid #efdde4;border-radius:18px;padding:14px;margin-top:12px}.form{display:grid;grid-template-columns:1.2fr 1fr 1.5fr auto;gap:8px;align-items:end}.field label{display:block;font-size:11px;font-weight:900;color:#78616a;margin-bottom:5px}.field input{width:100%;border:1px solid #efdde4;border-radius:10px;padding:10px}.msg{margin:12px 0;padding:10px;border-radius:11px;background:#fff;border:1px solid #efdde4;color:#78616a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid #efdde4;border-radius:16px;padding:13px}.top{display:flex;align-items:center;gap:8px}.name{font-weight:950;color:#4a101e}.badge{margin-left:auto;font-size:11px;font-weight:900;padding:4px 7px;border-radius:99px;background:#eefaf3;color:#14753e}.meta{font-size:12px;color:#78616a;margin-top:4px}.sum{margin:10px 0;padding:10px;border-radius:11px;background:#fff5f8;color:#4a101e;font-weight:900}.debt{border-top:1px solid #f1e3e8;padding:9px 0}.debt:first-child{border-top:0}.debtTop{display:flex;gap:8px;align-items:center}.debtTop b{color:#4a101e}.money{margin-left:auto;color:#ff0f68;font-weight:950}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.actions button{border:1px solid #efdde4;background:#fff;border-radius:9px;padding:8px 9px;font-weight:900}.pix{background:#eef4ff!important;color:#2459a9}.cash{background:#eefaf3!important;color:#14753e}.inactive{opacity:.55}.empty{padding:24px;text-align:center;color:#78616a}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.form .notes,.form .save{grid-column:1/-1}.grid{grid-template-columns:1fr}}@media(max-width:520px){.form{grid-template-columns:1fr}.form .notes,.form .save{grid-column:auto}}</style></head><body><script src="admin-common-v48.js?v=136"></script><main class="wrap"><div class="head"><div><h1>🤝 Clientes de confiança</h1><div style="font-size:12px;color:#78616a">Área exclusiva do Admin para vendas anotadas / fiado.</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button></div><div id="msg" class="msg">Carregando…</div><section class="panel"><b style="color:#4a101e">Cadastrar pessoa de confiança</b><div class="form" style="margin-top:10px"><div class="field"><label>NOME</label><input id="name" placeholder="Ex.: Carlos"></div><div class="field"><label>WHATSAPP (opcional)</label><input id="phone" placeholder="16 9..."></div><div class="field notes"><label>OBSERVAÇÃO (opcional)</label><input id="notes" placeholder="Ex.: colega de trabalho"></div><button id="save" class="btn primary save">+ Cadastrar</button></div></section><section class="panel"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><b style="color:#4a101e">Pessoas cadastradas</b><span class="sp"></span><span id="totalOpen" style="font-weight:950;color:#ff0f68"></span></div><div id="grid" class="grid"></div></section></main><script>
(async()=>{const $=id=>document.getElementById(id);let customers=[],orders=[];
function setMsg(t){$('msg').textContent=t}
async function load(){
 setMsg('Carregando clientes e fiados…');
 const [c,o]=await Promise.all([
  GDS48.sb.from('trusted_customers').select('*').order('active',{ascending:false}).order('name'),
  GDS48.sb.from('orders').select('id,public_code,customer_name,total,paid_amount,created_at,payment_method,payment_status,trusted_customer_id,deleted_at').not('trusted_customer_id','is',null).is('deleted_at',null).order('created_at',{ascending:false})
 ]);
 if(c.error||o.error){setMsg('Erro: '+(c.error||o.error).message);return}
 customers=c.data||[];orders=o.data||[];render();setMsg('🟢 Área de clientes de confiança atualizada.')
}
function render(){
 const pending=orders.filter(o=>o.payment_status!=='Pago');
 $('totalOpen').textContent='Em aberto: '+GDS48.money(pending.reduce((n,o)=>n+Number(o.total||0),0));
 $('grid').innerHTML=customers.length?customers.map(c=>{
   const debts=orders.filter(o=>o.trusted_customer_id===c.id&&o.payment_status!=='Pago');
   const total=debts.reduce((n,o)=>n+Math.max(0,Number(o.total||0)-Number(o.paid_amount||0)),0);
   return '<article class="card '+(c.active?'':'inactive')+'"><div class="top"><span class="name">'+GDS48.esc(c.name)+'</span><span class="badge">'+(c.active?'ATIVO':'INATIVO')+'</span></div><div class="meta">'+GDS48.esc(c.phone||'Sem telefone')+(c.notes?'<br>'+GDS48.esc(c.notes):'')+'</div><div class="sum">'+debts.length+' ordem(ns) em aberto · '+GDS48.money(total)+'</div><div>'+(
     debts.length?debts.map(o=>'<div class="debt"><div class="debtTop"><b>'+GDS48.esc(o.public_code)+'</b><span>'+new Date(o.created_at).toLocaleDateString('pt-BR')+'</span><span class="money">'+GDS48.money(o.total)+'</span></div><div class="actions"><button class="pix" onclick="settle(\''+o.id+'\',\'Pix\')">💠 Receber Pix</button><button class="cash" onclick="settle(\''+o.id+'\',\'Dinheiro\')">💵 Receber dinheiro</button></div></div>').join(''):'<div class="empty">Sem valores pendentes.</div>'
   )+'</div><div class="actions"><button onclick="toggleCustomer(\''+c.id+'\','+(!c.active)+')">'+(c.active?'Pausar cliente':'Reativar cliente')+'</button></div></article>'
 }).join(''):'<div class="empty">Nenhum cliente de confiança cadastrado.</div>'
}
$('save').onclick=async()=>{
 const name=$('name').value.trim();if(name.length<2)return alert('Informe o nome.');
 const phone=$('phone').value.trim()||null,notes=$('notes').value.trim()||null;
 const {error}=await GDS48.sb.from('trusted_customers').insert({name,phone,notes,active:true});
 if(error)return alert(error.message);
 $('name').value='';$('phone').value='';$('notes').value='';await load()
};
window.toggleCustomer=async(id,active)=>{const {error}=await GDS48.sb.from('trusted_customers').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await load()};
window.settle=async(id,method)=>{if(!confirm('Confirmar recebimento em '+method+'?'))return;const {error}=await GDS48.sb.rpc('settle_trusted_credit_v116',{p_order_id:id,p_payment_method:method});if(error)return alert(error.message);await load()};
$('refresh').onclick=load;
try{await GDS48.ensure('trusted');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message)}
})();</script></body></html>
