</style></head><body><script src="admin-common-v48.js?v=141"></script><main class="wrap"><div class="head"><div><h1>🤝 Clientes de confiança</h1><div style="font-size:12px;color:#78616a">Área exclusiva do Admin para vendas anotadas / fiado.</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button></div><div id="msg" class="msg">Carregando…</div><div id="dueNotice" class="msg" hidden></div><section class="panel"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><b style="color:#4a101e">📒 Fichas dos clientes e vendas fiadas</b><span class="sp"></span><span id="totalOpen" style="font-weight:950;color:#ff0f68"></span></div><div class="creditTools"><input id="creditSearch" type="search" autocomplete="off" aria-label="Pesquisar cliente por nome ou telefone" placeholder="🔎 Buscar cliente pelo nome ou telefone…"><select id="creditFilter" aria-label="Filtrar clientes"><option value="all">Todos os clientes</option><option value="debt">Somente com saldo devedor</option></select></div><div id="creditCount" class="creditCount"></div><div id="grid" class="grid"></div></section><details id="newCustomerDetails" class="panel newCustomerDetails"><summary>➕ Cadastrar ou editar cliente de confiança</summary><div style="margin-top:12px"><b id="formTitle" style="color:#4a101e">Cadastrar pessoa de confiança</b><div class="form" style="margin-top:10px"><div class="field"><label for="name">NOME</label><input id="name" maxlength="100" placeholder="Ex.: Carlos"></div><div class="field"><label for="phone">WHATSAPP (opcional)</label><input id="phone" type="tel" maxlength="18" placeholder="16 9..."></div><div class="field"><label for="due">DATA COMBINADA PARA PAGAMENTO (opcional)</label><input id="due" type="date"></div><div class="field notes"><label for="notes">ANOTAÇÕES (opcional)</label><textarea id="notes" rows="3" maxlength="3000" placeholder="Ex.: combinado de pagamento, endereço, preferências..."></textarea></div><div class="form-buttons"><button id="save" type="button" class="btn primary save">+ Cadastrar</button><button id="cancelEdit" type="button" class="btn" hidden>Cancelar edição</button></div></div></div></details></main><script>

(async()=>{
'use strict';
const $=id=>document.getElementById(id);
const sb=GDS48.sb;
const money=GDS48.money,esc=GDS48.esc;
let customers=[],orders=[],editingId=null,creditGroups=[];
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const digits=v=>String(v||'').replace(/\D/g,'');
const normalizedPhone=v=>{let n=digits(v);if(n.length>=12&&n.startsWith('55'))n=n.slice(2);return n};
const dateBR=v=>v?String(v).slice(8,10)+'/'+String(v).slice(5,7)+'/'+String(v).slice(0,4):'';
const balance=o=>Math.max(0,Number(o.total||0)-Number(o.paid_amount||0));
const outstanding=id=>orders.filter(o=>o.trusted_customer_id===id&&o.status!=='Cancelado'&&o.payment_status!=='Pago'&&balance(o)>0);
const normalizeName=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,' ').toLowerCase();
const creditIdentity=(name,phone)=>{const n=normalizeName(name),p=normalizedPhone(phone);return n&&/^[0-9]{10,11}$/.test(p)?'person:'+n+'|'+p:null};
const isCreditOrder=o=>o.payment_method==='Fiado'||Boolean(o.trusted_customer_id);
function setMsg(t){$('msg').textContent=t}
function resetForm(){
 editingId=null;$('name').value='';$('phone').value='';$('due').value='';$('notes').value='';
 $('formTitle').textContent='Cadastrar pessoa de confiança';$('save').textContent='+ Cadastrar';$('cancelEdit').hidden=true;
}
async function loadOrderHistory(){
 const all=[],size=500;
 for(let offset=0;offset<50000;offset+=size){
  const {data,error}=await sb.from('orders')
   .select('id,public_code,customer_name,customer_phone,total,paid_amount,created_at,payment_method,payment_status,trusted_customer_id,deleted_at,status,sales_channel,order_items(product_name,quantity,unit_price)')
   .is('deleted_at',null).order('created_at',{ascending:false}).order('id',{ascending:false})
   .range(offset,offset+size-1);
  if(error)return {data:null,error};
  all.push(...(data||[]));
  if((data||[]).length<size)return {data:all,error:null};
 }
 return {data:null,error:new Error('Histórico muito grande para esta consulta. É necessário ampliar a paginação.')};
}
async function load(){
 setMsg('Carregando clientes e pedidos…');
 const [c,o]=await Promise.all([sb.from('trusted_customers').select('*').is('deleted_at',null).order('name'),loadOrderHistory()]);
 const error=c.error||o.error;if(error){setMsg('Erro ao carregar: '+error.message);return}
 customers=c.data||[];orders=o.data||[];creditGroups=buildCreditGroups();
 if(editingId&&!customers.some(x=>x.id===editingId))resetForm();
 renderFiado();setMsg('🟢 '+creditGroups.length+' fichas de clientes atualizadas.');
}
function buildCreditGroups(){
 const byKey=new Map(),byId=new Map();
 function ensure(key,name,phone){
  if(!byKey.has(key))byKey.set(key,{key,name:name||'Cliente sem nome',phone:phone||'',records:[],purchases:[]});
  const g=byKey.get(key);
  if((!g.phone||g.name==='Cliente sem nome')&&phone){g.phone=phone;g.name=name||g.name}
  return g;
 }
 // O mesmo nome E telefone forma uma ficha; cadastros sem telefone continuam separados.
 customers.forEach(c=>{
  const key=creditIdentity(c.name,c.phone)||'cadastro:'+c.id;
  ensure(key,c.name,c.phone).records.push(c);
  byId.set(c.id,key);
 });
 // Pedidos online fiados sem cadastro também geram ficha e podem ser pesquisados.
 orders.forEach(o=>{
  if(o.sales_channel!=='online'&&o.payment_method!=='Fiado'&&!byId.has(o.trusted_customer_id))return;
  const key=byId.get(o.trusted_customer_id)||creditIdentity(o.customer_name,o.customer_phone)||'pedido:'+o.id;
  ensure(key,o.customer_name,o.customer_phone);
 });
 // Inclui todo histórico da pessoa: fiado, Pix, dinheiro, compras quitadas e canceladas.
 orders.forEach(o=>{
  const key=byId.get(o.trusted_customer_id)||creditIdentity(o.customer_name,o.customer_phone)||(o.payment_method==='Fiado'?'pedido:'+o.id:null);
  if(key&&byKey.has(key))byKey.get(key).purchases.push(o);
 });
 return [...byKey.values()].map(g=>{
  g.purchases.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  g.valid=g.purchases.filter(o=>o.status!=='Cancelado');
  g.debts=g.valid.filter(o=>isCreditOrder(o)&&balance(o)>0);
  g.debtTotal=g.debts.reduce((n,o)=>n+balance(o),0);
  g.purchasedTotal=g.valid.reduce((n,o)=>n+Number(o.total||0),0);
  g.receivedTotal=g.valid.reduce((n,o)=>n+Number(o.paid_amount||0),0);
  g.onlineCount=g.purchases.filter(o=>o.sales_channel==='online').length;
  return g;
 }).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'})||a.key.localeCompare(b.key));
}
function renderFiado(){
 const allPending=creditGroups.reduce((n,g)=>n+g.debtTotal,0);
 $('totalOpen').textContent='Total fiado a receber: '+money(allPending);
 const today=todayISO();
 const dueNow=creditGroups.filter(g=>g.debtTotal>0&&g.records.some(c=>c.active&&c.payment_due_date===today));
 $('dueNotice').hidden=!dueNow.length;
 $('dueNotice').textContent=dueNow.length?'🔔 '+dueNow.length+(dueNow.length===1?' cliente tem':' clientes têm')+' pagamento combinado para hoje. Use “Enviar lembrete” na ficha. Nenhuma mensagem é enviada automaticamente.':'';
 const typed=$('creditSearch').value.trim();
 const search=normalizeName(typed),phoneSearch=digits(typed);
 const rows=creditGroups.filter(g=>{
  const match=!typed||normalizeName(g.name).includes(search)||(phoneSearch.length>=3&&normalizedPhone(g.phone).includes(phoneSearch));
  return match&&($('creditFilter').value!=='debt'||g.debtTotal>0);
 });
 $('creditCount').textContent=rows.length+' ficha(s) encontrada(s) · '+creditGroups.length+' cliente(s) no total';
 $('grid').innerHTML=rows.length?rows.map(g=>{
  const active=g.records.length?g.records.some(c=>c.active):true;
  const dueRecord=g.records.find(c=>c.active&&c.payment_due_date===today);
  const dueDate=g.records.map(c=>c.payment_due_date).filter(Boolean).sort()[0];
  const due=dueDate?'<div class="dueBox">📅 Pagamento combinado: <b>'+dateBR(dueDate)+'</b>'+(dueRecord&&g.debtTotal>0?' · <b>HOJE</b>':'')+'</div>':'';
  const debts=g.debts.length?g.debts.map(o=>'<div class="debt"><div class="debtTop"><b>'+esc(o.public_code||'Pedido')+'</b><span>'+new Date(o.created_at).toLocaleDateString('pt-BR')+'</span><span class="money">'+money(balance(o))+'</span></div><div class="actions"><button class="pix" onclick="settle(\''+o.id+'\',\'Pix\')">💠 Receber Pix</button><button class="cash" onclick="settle(\''+o.id+'\',\'Dinheiro\')">💵 Receber dinheiro</button></div></div>').join(''):'<div class="empty">Nenhum fiado em aberto.</div>';
  const history=g.purchases.map(o=>{
   const cancelled=o.status==='Cancelado';
   const items=(o.order_items||[]).map(item=>'<div class="purchaseItem"><span>'+Number(item.quantity||0)+'× '+esc(item.product_name||'Produto')+'</span><b>'+money(Number(item.quantity||0)*Number(item.unit_price||0))+'</b></div>').join('');
   const payLabel=esc(o.payment_method||'Não informado');
   return '<div class="historyOrder '+(cancelled?'cancelled':'')+'"><div class="historyHead"><b>'+esc(o.public_code||'Pedido')+'</b><span>'+new Date(o.created_at).toLocaleString('pt-BR')+'</span><span class="statusMini">'+esc(o.sales_channel==='local'?'Local':'Online')+'</span><span class="money">'+money(o.total)+'</span></div>'+(items||'<div class="meta">Itens não disponíveis</div>')+'<div class="meta">Pagamento: '+payLabel+' · '+esc(cancelled?'Cancelado':o.payment_status||'Pendente')+' · Recebido: '+money(o.paid_amount)+(cancelled?' (não entra nos totais)':'')+(isCreditOrder(o)?' · Saldo fiado: '+money(balance(o)):'')+'</div></div>';
  }).join('');
  const notes=g.records.filter(c=>c.notes).map(c=>esc(c.notes)).filter((x,i,a)=>a.indexOf(x)===i).join('<div style="height:5px"></div>');
  const customerActions=g.records.length?'<details class="cadastros"><summary>✏️ Gerenciar cadastro'+(g.records.length>1?'s ('+g.records.length+')':'')+'</summary>'+g.records.map(c=>'<div class="meta">'+esc(c.name)+' · '+esc(c.phone||'Sem telefone')+' · '+(c.active?'Ativo':'Inativo')+'</div><div class="actions"><button type="button" onclick="editCustomer(\''+c.id+'\')">✏️ Editar</button><button type="button" onclick="deleteCustomer(\''+c.id+'\')">🗑️ Excluir</button><button type="button" onclick="toggleCustomer(\''+c.id+'\','+(!c.active)+')">'+(c.active?'Pausar':'Reativar')+'</button></div>').join('')+'</details>':'<div class="fiadoTip">Pedido online sem cadastro de cliente de confiança. Os registros ficam agrupados por nome e telefone, quando disponíveis.</div>';
  const rem=dueRecord&&g.debtTotal>0?'<div class="actions"><button type="button" class="pix" onclick="sendReminder(\''+dueRecord.id+'\')">💬 Enviar lembrete</button></div>':'';
  return '<details class="card clientCard '+(active?'':'inactive')+'"><summary class="clientSummary"><span class="clientSummaryLeft"><b>'+esc(g.name)+'</b><small>📱 '+esc(g.phone||'Telefone não informado')+'</small><small>'+g.purchases.length+' pedido(s) · '+g.onlineCount+' online</small></span><span class="clientSummaryRight"><span class="badge '+(g.debtTotal?'bWarning':'')+'">'+(g.debtTotal?'A RECEBER':'EM DIA')+'</span><strong>'+money(g.debtTotal)+'</strong><small>Ver histórico e dívidas</small></span></summary><div class="clientBody">'+(notes?'<div class="notesDisplay"><b>📝 Anotações</b><div>'+notes+'</div></div>':'')+due+'<div class="groupTotals"><div class="groupTotal"><small>COMPRAS</small><b>'+g.valid.length+' · '+money(g.purchasedTotal)+'</b></div><div class="groupTotal"><small>JÁ RECEBIDO</small><b>'+money(g.receivedTotal)+'</b></div><div class="groupTotal debtTotal"><small>TOTAL FIADO A RECEBER</small><b>'+money(g.debtTotal)+'</b></div></div>'+(g.debts.length?'<div class="meta"><b>Fiados em aberto ('+g.debts.length+')</b></div>':'')+debts+rem+'<details class="history" open><summary>🧾 Histórico de pedidos ('+g.purchases.length+')</summary>'+history+'<div class="historyFoot">TOTAL DEVIDO EM FIADOS: '+money(g.debtTotal)+'</div></details>'+customerActions+'</div></details>';
 }).join(''):'<div class="empty">Nenhum cliente encontrado para essa busca.</div>';
}
$('cancelEdit').onclick=resetForm;
$('save').onclick=async()=>{
 const name=$('name').value.trim(),phone=$('phone').value.trim()||null,notes=$('notes').value.trim()||null,due=$('due').value||null;
 if(name.length<2)return alert('Informe um nome com pelo menos 2 caracteres.');
 $('save').disabled=true;
 try{
  const payload={name,phone,notes,payment_due_date:due,updated_at:new Date().toISOString()};
  let q=editingId?sb.from('trusted_customers').update(payload).eq('id',editingId).is('deleted_at',null).select('id'):sb.from('trusted_customers').insert({...payload,active:true}).select('id');
  const {data,error}=await q;
  if(error)throw error;
  if(!data||data.length!==1)throw Error('Não foi possível confirmar o salvamento. Atualize e confira o cadastro.');
  resetForm();await load()
 }catch(e){alert('Não foi possível salvar: '+e.message)}
 finally{$('save').disabled=false}
};
window.editCustomer=id=>{
 const c=customers.find(x=>x.id===id);if(!c)return;
 $('newCustomerDetails').open=true;editingId=id;$('name').value=c.name||'';$('phone').value=c.phone||'';$('notes').value=c.notes||'';$('due').value=c.payment_due_date||'';
 $('formTitle').textContent='Editar cliente: '+c.name;$('save').textContent='💾 Salvar alterações';$('cancelEdit').hidden=false;
 $('formTitle').scrollIntoView({behavior:'smooth',block:'center'});$('name').focus();
};
window.deleteCustomer=async id=>{
 const c=customers.find(x=>x.id===id);if(!c)return;
 const group=creditGroups.find(g=>g.records.some(item=>item.id===id));
 const debt=group?.debtTotal||0;
 if(debt>0)return alert('Não é possível excluir '+c.name+' porque ainda há '+money(debt)+' em aberto na ficha. Receba ou regularize o pagamento antes. Você pode pausar este cliente.');
 if(!confirm('Excluir o cadastro de '+c.name+'?\n\nO cliente será removido da lista, mas pedidos antigos e pagamentos serão preservados.'))return;
 const {data,error}=await sb.from('trusted_customers').update({deleted_at:new Date().toISOString(),active:false,updated_at:new Date().toISOString()}).eq('id',id).is('deleted_at',null).select('id');
 if(error||!data?.length)return alert('Não foi possível excluir: '+(error?.message||'registro não encontrado'));
 if(editingId===id)resetForm();
 await load()
};
window.toggleCustomer=async(id,active)=>{
 const {data,error}=await sb.from('trusted_customers').update({active,updated_at:new Date().toISOString()}).eq('id',id).is('deleted_at',null).select('id');
 if(error||!data?.length)return alert('Não foi possível atualizar: '+(error?.message||'registro não encontrado'));
 await load()
};
async function linkCreditForSettlement(o){
 if(o.trusted_customer_id)return;
 const g=creditGroups.find(gr=>gr.purchases.some(p=>p.id===o.id));
 const rec=g?.records.find(c=>c.active)||g?.records[0];
 let id=rec?.id;
 if(!id){
  const name=String(o.customer_name||'').trim();
  if(name.length<2)throw new Error('Este pedido não tem nome suficiente para criar a ficha.');
  const {data,error}=await sb.from('trusted_customers')
   .insert({name,phone:o.customer_phone||null,active:true})
   .select('id').single();
  if(error)throw error;
  id=data.id;
 }
 const {data,error}=await sb.from('orders').update({trusted_customer_id:id})
  .eq('id',o.id).eq('payment_method','Fiado').is('trusted_customer_id',null)
  .is('deleted_at',null).select('id');
 if(error||!data?.length)throw new Error(error?.message||'Não foi possível vincular o fiado ao cadastro. Atualize a página.');
 o.trusted_customer_id=id;
}
window.settle=async(id,method)=>{
 const o=orders.find(item=>item.id===id);
 if(!o||o.status==='Cancelado'||balance(o)<=0)return alert('Pedido sem saldo a receber. Atualize a página.');
 if(!confirm('Confirmar o recebimento de '+money(balance(o))+' em '+method+' no pedido '+o.public_code+'?\n\nSomente confirme se o dinheiro realmente foi recebido.'))return;
 try{
  if(!o.trusted_customer_id)await linkCreditForSettlement(o);
  const {error}=await sb.rpc('settle_trusted_credit_v116',{p_order_id:id,p_payment_method:method});
  if(error)throw error;
  await load();
 }catch(e){alert('Não foi possível registrar pagamento: '+e.message);await load()}
};
window.sendReminder=id=>{
 const c=customers.find(x=>x.id===id);if(!c)return;
 const g=creditGroups.find(item=>item.records.some(record=>record.id===id));
 const total=g?.debtTotal||0,today=todayISO();
 if(!total||!c.active||c.payment_due_date!==today)return alert('Este lembrete está disponível somente no dia combinado e para clientes com saldo em aberto.');
 const d=String(Number(today.slice(8,10)));
 const message='Olá, '+(g.name||c.name)+'! 💗🍦\n\nTudo bem? Esperamos que seu dia esteja sendo maravilhoso!\n\nPassando para lembrar que hoje, dia *'+d+'*, é a data que combinamos para o acerto dos seus geladinhos da *Geladinho do Sonhos*.\n\n💰 *Total de fiados em aberto:* '+money(total)+'\n\nAgradecemos muito pela confiança e por fazer parte dos nossos clientes especiais!\n\nQuando puder, é só nos dar um retorno por aqui.\n\n*Geladinho do Sonhos — Feito para você!* 💕';
 const phone=normalizedPhone(g.phone||c.phone);
 if(!/^[0-9]{10,11}$/.test(phone)){
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(message).then(()=>alert('Mensagem copiada. O cliente não tem WhatsApp válido cadastrado.')).catch(()=>prompt('Copie a mensagem:',message));
  else prompt('Copie a mensagem:',message);
  return;
 }
 window.open('https://wa.me/55'+phone+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');
};
$('creditSearch').addEventListener('input',renderFiado);
$('creditFilter').addEventListener('change',renderFiado);
$('refresh').onclick=load;
try{await GDS48.ensure('trusted');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message)}
})();
</script></body></html>
