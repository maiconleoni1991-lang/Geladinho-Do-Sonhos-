<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=30"><title>Pedidos — Geladinho dos Sonhos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>:root{--p:#ff0f68;--w:#4a101e;--line:#efdde4;--muted:#78616a;--g:#19b15b;--red:#c9364d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#fff8fb;color:#29171d}.wrap{max-width:1120px;margin:auto;padding:14px}.head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-14px -14px 14px;padding:12px 14px;background:#fffafcee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px}.brand img{width:46px;height:46px;object-fit:contain}.brand h1{margin:0;color:var(--w);font-size:22px}.brand small{display:block;color:var(--muted);font-size:11px}.operator{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 8px}.operator span{font-size:11px;color:var(--muted);font-weight:800}.operator select{border:0;background:#fff;color:var(--w);font-weight:900;outline:0}.notify{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-weight:900}.notify.on{background:#eaf9f0;color:#126c39}.alertState{width:100%;display:none;padding:9px 12px;border-radius:12px;background:#fff0f5;border:1px solid #ffc4d8;color:#8b2346;font-weight:900;font-size:12px}.alertState.on{display:block}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button,.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;color:var(--w)}.tabs button.on,.filters button.on{background:var(--p);color:#fff;border-color:var(--p)}.filters{display:none}.filters.show{display:flex}.custom{display:none;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.custom.show{display:flex}.custom label{font-size:11px;color:var(--muted);font-weight:800}.custom input{display:block;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px}.custom button{border:0;background:var(--w);color:#fff;border-radius:10px;padding:10px 13px;font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.sum small{color:var(--muted);font-size:11px}.sum b{display:block;font-size:22px;color:var(--w);margin-top:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.order{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 14px 34px rgba(99,23,51,.08);overflow:hidden}.order.new{border:2px solid var(--p);box-shadow:0 18px 42px rgba(255,15,104,.18)}.stamp{position:absolute;right:13px;top:44px;border:3px solid currentColor;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:1000;letter-spacing:.07em;transform:rotate(-7deg);opacity:.8}.stamp.approved{color:#16814a}.stamp.finalized{color:#4a101e}.stamp.cancelled{color:#c9364d}.topline{display:flex;gap:8px}.tag{background:linear-gradient(90deg,var(--p),#ff4e8e);color:#fff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:950}.statusTag{margin-left:auto;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:900;background:#f7eff2;color:#6e4050}.order h3{margin:10px 0 4px;color:#3e1220;font-size:18px;padding-right:90px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.pill{background:#fff4f7;border:1px solid #f5d9e3;border-radius:99px;padding:5px 8px;font-size:12px;font-weight:800}.price{color:var(--p);font-weight:950}.contact{display:grid;gap:7px;margin:10px 0}.contact a,.contact div{display:flex;align-items:flex-start;gap:7px;text-decoration:none;color:#4c313a;font-size:13px;background:#fffafd;border:1px solid #f4e3e9;border-radius:12px;padding:9px 10px}.items{background:#fff7fa;border:1px solid #f3e1e7;border-radius:14px;padding:10px;margin:10px 0}.item{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dashed #f0dfe5}.item:last-child{border-bottom:0}.notes,.cancelReason{font-size:12px;border-radius:12px;padding:9px;margin:9px 0}.notes{color:#6c5660;background:#fff8ed;border:1px solid #f6e1bc}.cancelReason{color:#971f36;background:#fff0f3;border:1px solid #f1b8c5;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 9px;font-weight:950;font-size:13px}.accept{background:var(--g);color:#fff}.reject{background:#ffe8ed;color:#a51f3a}.prepare{background:#fff0d8;color:#945a00}.dispatch{background:#e8f1ff;color:#215d9c}.finish{background:#e5f8ec;color:#14753e}.archive{background:#3f1630;color:#fff}.back{background:#f3edf0;color:#694653}.more{margin-top:9px}.more select{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.history{display:grid;gap:7px}.historyRow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:100px 100px minmax(150px,1fr) 100px 110px 30px;gap:8px;align-items:center}.historyRow.cancel{border-left:4px solid var(--red)}.historyRow.final{border-left:4px solid var(--g)}.hdate{font-size:11px;color:var(--muted)}.hcode,.hname,.htotal{font-weight:900}.htotal{color:var(--p)}.hst{font-size:10px;font-weight:950;text-align:center;border:2px solid currentColor;border-radius:6px;padding:4px}.hst.final{color:#367a50}.hst.cancel{color:#b72b46}.expand{border:0;background:#f8eef2;border-radius:8px;width:30px;height:30px;font-weight:900}.historyDetail{display:none;grid-column:1/-1;border-top:1px solid #f2e5ea;padding-top:9px}.historyRow.open .historyDetail{display:block}.histItems{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}.histItems span{font-size:11px;background:#fff5f8;border:1px solid #f3dce4;border-radius:99px;padding:4px 7px}.empty{text-align:center;color:var(--muted);padding:45px}.warn{background:#fff0f5;border:1px solid #ffc9db;padding:14px;border-radius:14px}.updated{font-size:11px;color:var(--muted);text-align:right;margin-top:8px}.overlay{position:fixed;inset:0;background:#240b1488;display:none;place-items:center;padding:16px;z-index:100}.overlay.show{display:grid}.modal{width:min(500px,100%);background:#fff;border-radius:20px;padding:18px;box-shadow:0 25px 80px #210a1466}.modal h2{margin:0 0 6px;color:var(--w)}.modal p{margin:0 0 13px;color:var(--muted);font-size:13px}.modal label{display:block;font-size:12px;font-weight:900;color:var(--w);margin-top:10px}.modal select,.modal textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.modal textarea{min-height:70px;resize:vertical}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.modalActions button{border:0;border-radius:12px;padding:11px;font-weight:900}.confirmCancel{background:var(--red);color:#fff}.closeModal{background:#f3edf0;color:var(--w)}@media(max-width:820px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.historyRow{grid-template-columns:76px 86px 1fr 78px 30px}.historyRow .hst{grid-column:3/5;justify-self:start}.historyRow .expand{grid-column:5;grid-row:1}}@media(max-width:560px){.wrap{padding:10px}.head{margin:-10px -10px 10px;padding:10px}.operator{margin-left:0}.brand{width:100%}.tabs button{flex:1}.filters.show{display:grid;grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr}.historyRow{grid-template-columns:70px 76px 1fr 30px}.historyRow .htotal{grid-column:3}.historyRow .hst{grid-column:2/4}.historyRow .expand{grid-column:4;grid-row:1}.order h3{padding-right:75px}}</style></head><body><div class="wrap"><div class="head"><div class="brand"><img src="../assets/logo-oficial.webp?v=30" alt="Geladinho dos Sonhos"><div><h1>Pedidos</h1><small>Central de atendimento</small></div></div><div class="operator"><span>Atendente</span><select id="operator"><option value="Maicon">Maicon</option><option value="Moniza">Moniza</option></select></div><button id="notify" class="notify">🔔 Ativar campainha</button><div id="alertState" class="alertState"></div></div><div id="msg"></div><div class="tabs"><button id="tabOpen" class="on">Pedidos em aberto</button><button id="tabClosed">Histórico</button></div><div id="filters" class="filters"><button data-p="today" class="on">Hoje</button><button data-p="7">7 dias</button><button data-p="30">30 dias</button><button data-p="month">Este mês</button><button data-p="all">Todos</button><button data-p="custom">Período</button></div><div id="custom" class="custom"><label>De<input id="from" type="date"></label><label>Até<input id="to" type="date"></label><button id="apply">Aplicar</button></div><div id="summary" class="summary"></div><div id="grid" class="grid"></div><div id="history" class="history" style="display:none"></div><div id="updated" class="updated"></div></div><div id="cancelOverlay" class="overlay"><div class="modal"><h2>Cancelar pedido</h2><p>Informe o motivo. Esta informação ficará registrada no histórico.</p><label>Motivo<select id="cancelReason"><option value="">Selecione...</option><option>Produto ou sabor sem estoque</option><option>Quantidade insuficiente em estoque</option><option>Endereço fora da área de entrega</option><option>Não conseguimos atender no momento</option><option>Cliente solicitou o cancelamento</option><option>Dados ou endereço incompletos</option><option>Outro motivo</option></select></label><label id="otherWrap" style="display:none">Outro motivo<textarea id="otherReason" placeholder="Descreva o motivo"></textarea></label><div class="modalActions"><button id="closeCancel" class="closeModal">Voltar</button><button id="confirmCancel" class="confirmCancel">Confirmar cancelamento</button></div></div></div><script>const{createClient}=supabase,sb=createClient('https://qpqruhcspbdxjcnbhdhn.supabase.co','sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk'),$=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let allOrders=[],view='open',period='today',customRange=null,cancelId=null,audioCtx=null,bellTimer=null;operator.value=localStorage.getItem('gds_admin_operator')||'Maicon';operator.onchange=()=>localStorage.setItem('gds_admin_operator',operator.value);async function admin(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const{data}=await sb.from('admin_users').select('user_id').maybeSingle();return!!data}function address(o){if(o.fulfillment!=='entrega'||!o.address)return'Retirada no local';const a=o.address;return`${a.street||''}, ${a.number||''}${a.complement?' · '+a.complement:''} · ${a.district||''}${a.reference?' · Ref.: '+a.reference:''}`}function stamp(o){if(o.status==='Finalizado')return'<span class="stamp finalized">FINALIZADO</span>';if(o.status==='Cancelado')return'<span class="stamp cancelled">CANCELADO</span>';if(['Aceito','Em preparação','Saiu para entrega','Entregue'].includes(o.status))return'<span class="stamp approved">APROVADO</span>';return''}function nextButtons(o){if(o.status==='Pedido recebido')return`<button class="accept" onclick="setStatus('${o.id}','Aceito')">✓ Aceitar</button><button class="reject" onclick="askCancel('${o.id}')">✕ Recusar</button>`;if(o.status==='Aceito')return`<button class="prepare" onclick="setStatus('${o.id}','Em preparação')">👩‍🍳 Iniciar preparo</button><button class="back" onclick="askCancel('${o.id}')">Cancelar</button>`;if(o.status==='Em preparação'&&o.fulfillment==='entrega')return`<button class="dispatch" onclick="setStatus('${o.id}','Saiu para entrega')">🛵 Saiu p/ entrega</button><button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Entregue</button>`;if(o.status==='Em preparação')return`<button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Pronto/Entregue</button><button class="back" onclick="askCancel('${o.id}')">Cancelar</button>`;if(o.status==='Saiu para entrega')return`<button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Marcar entregue</button><button class="back" onclick="setStatus('${o.id}','Em preparação')">↶ Voltar</button>`;if(o.status==='Entregue')return`<button class="archive" onclick="setStatus('${o.id}','Finalizado')">✓ Finalizar pedido</button><button class="back" onclick="setStatus('${o.id}','Em preparação')">↶ Reabrir</button>`;return`<button class="back" onclick="setStatus('${o.id}','Pedido recebido')">↶ Reabrir pedido</button>`}function summary(x){$('summary').innerHTML=`<div class="sum"><small>Novos</small><b>${x.filter(o=>o.status==='Pedido recebido').length}</b></div><div class="sum"><small>Preparando</small><b>${x.filter(o=>['Aceito','Em preparação'].includes(o.status)).length}</b></div><div class="sum"><small>Na rua</small><b>${x.filter(o=>o.status==='Saiu para entrega').length}</b></div><div class="sum"><small>Aguardando finalizar</small><b>${x.filter(o=>o.status==='Entregue').length}</b></div>`}function dateRange(){const n=new Date(),e=new Date(n),s=new Date(n);e.setHours(23,59,59,999);s.setHours(0,0,0,0);if(period==='today')return[s,e];if(period==='7'){s.setDate(s.getDate()-6);return[s,e]}if(period==='30'){s.setDate(s.getDate()-29);return[s,e]}if(period==='month')return[new Date(n.getFullYear(),n.getMonth(),1),e];if(period==='custom'&&customRange)return customRange;return null}function historyOrders(){let x=allOrders.filter(o=>['Finalizado','Cancelado'].includes(o.status));const r=dateRange();if(r)x=x.filter(o=>{const d=new Date(o.updated_at||o.created_at);return d>=r[0]&&d<=r[1]});return x}function card(o){return`<article class="order ${o.status==='Pedido recebido'?'new':''}">${stamp(o)}<div class="topline">${o.status==='Pedido recebido'?'<span class="tag">🔔 NOVO PEDIDO</span>':''}<span class="statusTag">${esc(o.status)}</span></div><h3>#${esc(o.public_code)} · ${esc(o.customer_name)}</h3><div class="meta"><span class="pill price">${money(o.total)}</span><span class="pill">${o.fulfillment==='entrega'?'🛵 Entrega':'🏠 Retirada'}</span></div><div class="contact"><a href="tel:${esc(o.customer_phone||'')}">📱 ${esc(o.customer_phone||'Sem telefone')}</a><div>${o.fulfillment==='entrega'?'📍':'🏠'} ${esc(address(o))}</div></div>${o.notes?`<div class="notes">📝 ${esc(o.notes)}</div>`:''}${o.cancel_reason?`<div class="cancelReason">✕ ${esc(o.cancel_reason)}${o.canceled_by?` · por ${esc(o.canceled_by)}`:''}</div>`:''}<div class="items">${(o.order_items||[]).map(i=>`<div class="item"><span><b>${i.quantity}x</b> ${esc(i.product_name)}</span><b>${money(Number(i.unit_price)*i.quantity)}</b></div>`).join('')}</div><div class="actions">${nextButtons(o)}</div><div class="more"><select onchange="this.value==='Cancelado'?askCancel('${o.id}'):setStatus('${o.id}',this.value)">${['Pedido recebido','Aceito','Em preparação','Saiu para entrega','Entregue','Finalizado','Cancelado'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></div></article>`}function hist(o){const final=o.status==='Finalizado';return`<div class="historyRow ${final?'final':'cancel'}"><div class="hdate">${new Date(o.updated_at||o.created_at).toLocaleDateString('pt-BR')}<br>${new Date(o.updated_at||o.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div><div class="hcode">#${esc(o.public_code)}</div><div class="hname">${esc(o.customer_name)}</div><div class="htotal">${final?money(o.total):'—'}</div><div class="hst ${final?'final':'cancel'}">${final?'FINALIZADO':'CANCELADO'}</div><button class="expand" onclick="this.parentElement.classList.toggle('open')">⌄</button><div class="historyDetail">${!final?`<div class="cancelReason">Motivo: ${esc(o.cancel_reason||'Não informado')}<br>Cancelado por: <b>${esc(o.canceled_by||'Não informado')}</b></div>`:''}<div class="histItems">${(o.order_items||[]).map(i=>`<span>${i.quantity}x ${esc(i.product_name)}</span>`).join('')}</div><small>${o.fulfillment==='entrega'?'🛵 '+esc(address(o)):'🏠 Retirada no local'}</small></div></div>`}function render(){const open=allOrders.filter(o=>!['Finalizado','Cancelado'].includes(o.status));$('grid').style.display=view==='open'?'grid':'none';$('history').style.display=view==='closed'?'grid':'none';$('summary').style.display=view==='open'?'grid':'none';$('filters').classList.toggle('show',view==='closed');$('custom').classList.toggle('show',view==='closed'&&period==='custom');if(view==='open')$('grid').innerHTML=open.length?open.map(card).join(''):'<div class="empty">Nenhum pedido em aberto.</div>';else{const h=historyOrders();$('history').innerHTML=h.length?h.map(hist).join(''):'<div class="empty">Nenhum pedido no período.</div>'}}function ding(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime+.02;[[880,0,.22],[660,.28,.32]].forEach(([f,off,d])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+off);g.gain.exponentialRampToValueAtTime(.6,t+off+.01);g.gain.exponentialRampToValueAtTime(.0001,t+off+d);o.connect(g);g.connect(audioCtx.destination);o.start(t+off);o.stop(t+off+d+.02)})}catch(_){}}function updateBell(){const pending=allOrders.filter(o=>o.status==='Pedido recebido');$('alertState').classList.toggle('on',pending.length>0);$('alertState').textContent=pending.length?`🔔 ${pending.length} pedido${pending.length>1?'s':''} aguardando atendimento — a campainha continuará até aceitar ou cancelar.`:'';if(!pending.length){clearInterval(bellTimer);bellTimer=null;return}if(localStorage.getItem('gds_admin_bell')==='1'&&!bellTimer){ding();bellTimer=setInterval(()=>{if(allOrders.some(o=>o.status==='Pedido recebido'))ding();else{clearInterval(bellTimer);bellTimer=null}},9000)}}function notifyNew(o){const k='gds_admin_notified_'+o.id;if(localStorage.getItem(k)==='1')return;localStorage.setItem(k,'1');try{if(Notification.permission==='granted')new Notification('🔔 Novo pedido '+o.public_code,{body:`${o.customer_name} · ${money(o.total)}`,icon:'../assets/icon-192.png?v=30',tag:'gds-new-'+o.id})}catch(_){}}async function load(){if(!await admin()){$('msg').innerHTML='<div class="warn">Entre primeiro em Produtos / Estoque com sua conta de administrador.</div>';return}const{data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(1000);if(error){$('msg').textContent=error.message;return}const prev=new Set(allOrders.map(o=>o.id));allOrders=data||[];allOrders.filter(o=>o.status==='Pedido recebido'&&!prev.has(o.id)).forEach(notifyNew);summary(allOrders.filter(o=>!['Finalizado','Cancelado'].includes(o.status)));render();updateBell();$('updated').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}window.setStatus=async(id,status)=>{if(status==='Cancelado')return askCancel(id);const patch={status};if(status!=='Cancelado'){patch.cancel_reason=null;patch.canceled_by=null}const{error}=await sb.from('orders').update(patch).eq('id',id);if(error)return alert(error.message);await load()};window.askCancel=id=>{cancelId=id;$('cancelReason').value='';$('otherReason').value='';$('otherWrap').style.display='none';$('cancelOverlay').classList.add('show')};$('cancelReason').onchange=()=>{ $('otherWrap').style.display=$('cancelReason').value==='Outro motivo'?'block':'none'};$('closeCancel').onclick=()=>{$('cancelOverlay').classList.remove('show');cancelId=null};$('confirmCancel').onclick=async()=>{let reason=$('cancelReason').value;if(reason==='Outro motivo')reason=$('otherReason').value.trim();if(!reason)return alert('Informe o motivo do cancelamento.');const who=$('operator').value;if(!['Maicon','Moniza'].includes(who))return alert('Selecione o atendente.');const{error}=await sb.from('orders').update({status:'Cancelado',cancel_reason:reason,canceled_by:who}).eq('id',cancelId);if(error)return alert(error.message);$('cancelOverlay').classList.remove('show');cancelId=null;await load()};$('tabOpen').onclick=()=>{view='open';$('tabOpen').classList.add('on');$('tabClosed').classList.remove('on');render()};$('tabClosed').onclick=()=>{view='closed';$('tabClosed').classList.add('on');$('tabOpen').classList.remove('on');render()};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');period=b.dataset.p;if(period!=='custom')render();else $('custom').classList.add('show')});$('apply').onclick=()=>{if(!$('from').value||!$('to').value)return alert('Escolha as duas datas.');const a=new Date($('from').value+'T00:00:00'),b=new Date($('to').value+'T23:59:59');if(a>b)return alert('Período inválido.');customRange=[a,b];render()};$('notify').onclick=async()=>{try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume()}catch(_){}let p='granted';if('Notification'in window&&Notification.permission!=='granted')p=await Notification.requestPermission();localStorage.setItem('gds_admin_bell','1');$('notify').classList.add('on');$('notify').textContent=p==='granted'?'🔔 Campainha ativa':'🔔 Som ativo';updateBell()};if(localStorage.getItem('gds_admin_bell')==='1'){$('notify').classList.add('on');$('notify').textContent='🔔 Campainha ativa'}load();setInterval(load,7000);</script></body></html>
