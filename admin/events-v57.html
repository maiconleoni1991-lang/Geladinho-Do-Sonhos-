<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Festas e Eventos — GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1120px;margin:auto;padding:16px 12px 70px}.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900}.primary{background:#ff0f68;color:#fff;border-color:#ff0f68}.msg{margin:12px 0;padding:11px;background:#fff;border:1px solid #efdde4;border-radius:11px;color:#78616a}.ok{color:#14753e}.err{color:#b02a42}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.event{background:#fff;border:1px solid #efdde4;border-radius:18px;padding:14px}.top{display:flex;gap:8px;align-items:center}.code{font-weight:950;color:#4a101e}.status{margin-left:auto;font-size:11px;font-weight:900;background:#fff0f5;border-radius:99px;padding:5px 8px}.meta{font-size:12px;color:#78616a;margin-top:5px}.items{margin:10px 0;background:#fff7fa;border:1px solid #f1e0e7;border-radius:12px;padding:9px}.item{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:1px solid #efdde4;background:#fff;border-radius:9px;padding:8px;font-weight:800}.empty{padding:35px;text-align:center;color:#78616a}dialog{width:min(760px,calc(100% - 20px));max-height:94vh;overflow:auto;border:0;border-radius:22px;padding:0}dialog::backdrop{background:#2a0a1677}.modal{padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{font-size:12px;font-weight:800;color:#78616a}.field input,.field select,.field textarea{display:block;width:100%;margin-top:4px;border:1px solid #efdde4;border-radius:10px;padding:9px;background:#fff}.full{grid-column:1/-1}.group{grid-column:1/-1;border:1px solid #efdde4;border-radius:14px;padding:12px;background:#fffafc}.groupTitle{font-weight:950;color:#4a101e;margin-bottom:8px}.finance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}.sum{background:#fff;border:1px solid #efdde4;border-radius:11px;padding:9px}.sum small{display:block;color:#78616a;font-size:10px}.sum b{display:block;color:#4a101e;margin-top:2px}.sum.balance{background:#ffedf4;border-color:#ffc6da}.sum.balance b{color:#ff0f68}.lines{grid-column:1/-1;border:1px solid #efdde4;border-radius:12px;padding:10px}.line{display:grid;grid-template-columns:1fr 100px 36px;gap:6px;margin-top:6px}.line select,.line input{border:1px solid #efdde4;border-radius:9px;padding:9px;width:100%}.line button{border:0;border-radius:9px;background:#fff0f5;color:#a42b50;font-weight:900}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.form,.finance{grid-template-columns:1fr}.full{grid-column:auto}.group,.summary{grid-column:auto}.summary{grid-template-columns:1fr 1fr}}</style></head><body><script src="admin-common-v48.js?v=83"></script><main class="wrap"><div class="head"><div><h1>Festas / Eventos</h1><div style="font-size:12px;color:#78616a">Agenda e encomendas com estoque compartilhado</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button><button id="new" class="btn primary">+ Nova encomenda</button></div><div id="msg" class="msg">Carregando eventos…</div><div id="grid" class="grid"></div></main><dialog id="dlg"><div class="modal"><h2 id="title">Encomenda</h2><div class="form"><div class="field"><label>Solicitante<input id="customer"></label></div><div class="field"><label>Telefone<input id="phone"></label></div><div class="field"><label>CPF / CNPJ<input id="document" placeholder="Opcional"></label></div><div class="field"><label>Evento<input id="eventName"></label></div><div class="field"><label>Tipo<input id="eventType" placeholder="Aniversário, igreja..."></label></div><div class="field"><label>Data<input id="eventDate" type="date"></label></div><div class="field"><label>Horário<input id="eventTime" type="time"></label></div><div class="field"><label>Status<select id="status"><option>Solicitado</option><option>Orçamento</option><option>Confirmado</option><option>Preparando</option><option>Pronto</option><option>Concluído</option><option>Cancelado</option></select></label></div><div class="group"><div class="groupTitle">Entrega / retirada</div><div class="finance"><div class="field"><label>Forma<select id="fulfillment"><option>Retirada</option><option>Entrega</option></select></label></div><div class="field"><label>Taxa de entrega (R$)<input id="deliveryFee" type="number" min="0" step="0.01" value="0"></label></div><div class="field"><label>Prazo / horário combinado<input id="deadline" type="datetime-local"></label></div><div class="field full"><label>Local / endereço<input id="venue"></label></div></div></div><div class="group"><div class="groupTitle">Pagamento</div><div class="finance"><div class="field"><label>Forma de pagamento<select id="paymentMethod"><option value="">A combinar</option><option>PIX</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Outro</option></select></label></div><div class="field"><label>Valor do sinal (R$)<input id="deposit" type="number" min="0" step="0.01" value="0"></label></div><div class="field"><label>Observação do pagamento<input id="payment" placeholder="Ex.: saldo até a entrega"></label></div><div class="summary"><div class="sum"><small>Subtotal</small><b id="sumSubtotal">R$ 0,00</b></div><div class="sum"><small>Taxa</small><b id="sumFee">R$ 0,00</b></div><div class="sum"><small>Sinal</small><b id="sumDeposit">R$ 0,00</b></div><div class="sum balance"><small>Saldo restante</small><b id="sumBalance">R$ 0,00</b></div></div></div></div><div class="field full"><label>Observações da encomenda<textarea id="notes" rows="2"></textarea></label></div><div class="lines"><b>Produtos / sabores</b><div id="lines"></div><button id="addLine" class="btn" style="margin-top:8px">+ Adicionar sabor</button><div id="total" style="margin-top:8px;font-weight:900;color:#4a101e"></div></div></div><div id="saveMsg" class="msg"></div><div class="modalBtns"><button id="cancel" class="btn">Cancelar</button><button id="save" class="btn primary">Salvar encomenda</button></div></div></dialog><script>(async()=>{const $=x=>document.getElementById(x);let events=[],products=[],editing=null;const num=v=>Math.max(0,Number(v)||0);function setMsg(t,c=''){$('msg').textContent=t;$('msg').className='msg '+c}async function load(){setMsg('Carregando eventos…');const [e,p]=await Promise.all([GDS48.sb.from('events').select('*,event_items(*)').order('event_date',{ascending:true}),GDS48.sb.from('products').select('id,name,category,price,stock,active').order('sort_order')]);if(e.error){setMsg(e.error.message,'err');return}if(p.error){setMsg(p.error.message,'err');return}events=e.data||[];products=p.data||[];render();setMsg(`🟢 ${events.length} encomenda(s) carregada(s) · sincronizado agora`,'ok')}function grand(e){return Number(e.subtotal||0)+Number(e.delivery_fee||0)}
function phoneWa(v){let p=String(v||'').replace(/\\D/g,'');if(!p)return'';if(!p.startsWith('55'))p='55'+p;return p}
window.waE=id=>{const e=events.find(x=>x.id===id);if(!e)return;const p=phoneWa(e.customer_phone);if(!p)return alert('Cliente sem WhatsApp válido.');const date=new Date(e.event_date+'T12:00:00').toLocaleDateString('pt-BR');const items=(e.event_items||[]).map(i=>`• ${i.quantity}x ${i.product_name}`).join('\\n');const msg=`Olá, ${e.customer_name}! 🎉🍧 Aqui é o *Geladinho dos Sonhos*.

Segue a atualização da sua encomenda *${e.event_code}*:
Evento: ${e.event_name}
Data: ${date}${e.event_time?' às '+String(e.event_time).slice(0,5):''}
Status: *${e.status}*
${e.fulfillment_type||'Retirada'}${e.delivery_deadline?' — combinado para '+new Date(e.delivery_deadline).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''}

Itens:
${items}

Total: ${GDS48.money(grand(e))}
Sinal: ${GDS48.money(e.deposit_amount)}
Saldo: ${GDS48.money(e.balance_amount)}

Qualquer dúvida, estamos à disposição. 💗
*Geladinho dos Sonhos*`;window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank','noopener')};
function render(){$('grid').innerHTML=events.length?events.map(e=>`<article class="event"><div class="top"><span class="code">${GDS48.esc(e.event_code)}</span><b>${GDS48.esc(e.customer_name)}</b><span class="status">${GDS48.esc(e.status)}</span></div><div class="meta">${new Date(e.event_date+'T12:00:00').toLocaleDateString('pt-BR')} ${e.event_time?('· '+String(e.event_time).slice(0,5)):''} · ${GDS48.esc(e.event_name)}</div><div class="meta">${GDS48.esc(e.fulfillment_type||'Retirada')} · ${GDS48.esc(e.payment_method||'Pagamento a combinar')}</div><div class="items">${(e.event_items||[]).map(i=>`<div class="item"><span>${i.quantity}× ${GDS48.esc(i.product_name)}</span><b>${GDS48.money(Number(i.unit_price)*Number(i.quantity))}</b></div>`).join('')}</div><div style="font-weight:950;color:#ff0f68;margin-bottom:4px">Total ${GDS48.money(grand(e))} · Saldo ${GDS48.money(e.balance_amount)}</div><div style="font-size:11px;color:#78616a;margin-bottom:9px">${e.stock_reserved?'📦 Estoque reservado':'⏳ Sem reserva'}</div><div class="actions"><button onclick="editE('${e.id}')">✏️ Editar</button><button onclick="waE('${e.id}')">💬 WhatsApp cliente</button><button onclick="printE('${e.id}')">Baixar PDF A4</button><button onclick="csvE('${e.id}')">CSV</button><button onclick="deleteE('${e.id}')">Excluir</button></div></article>`).join(''):'<div class="empty">Nenhuma encomenda cadastrada.</div>'}function opts(selected=''){return products.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${GDS48.esc(p.name)} · ${GDS48.money(p.price)} · estoque ${p.stock}</option>`).join('')}function addLine(item=null){const d=document.createElement('div');d.className='line';d.innerHTML=`<select>${opts(item?.product_id||'')}</select><input type="number" min="1" step="1" value="${item?.quantity||1}"><button type="button">×</button>`;d.querySelector('button').onclick=()=>{d.remove();calc()};d.querySelectorAll('select,input').forEach(x=>x.onchange=calc);$('lines').appendChild(d);calc()}function calc(){let qty=0,subtotal=0;[...$('lines').children].forEach(l=>{const p=products.find(x=>x.id===l.querySelector('select').value),q=Math.max(1,Number(l.querySelector('input').value)||1);qty+=q;subtotal+=(Number(p?.price)||0)*q});const fee=$('fulfillment').value==='Entrega'?num($('deliveryFee').value):0;const deposit=num($('deposit').value);const balance=Math.max(subtotal+fee-deposit,0);$('total').textContent=`${qty} unidades · ${GDS48.money(subtotal+fee)} total`;$('sumSubtotal').textContent=GDS48.money(subtotal);$('sumFee').textContent=GDS48.money(fee);$('sumDeposit').textContent=GDS48.money(deposit);$('sumBalance').textContent=GDS48.money(balance)}document.addEventListener('gds-event-calc',calc);function syncFulfillment(){const delivery=$('fulfillment').value==='Entrega';$('deliveryFee').disabled=!delivery;if(!delivery)$('deliveryFee').value='0';calc()}function openForm(e=null){editing=e?.id||null;$('title').textContent=e?`Editar ${e.event_code}`:'Nova encomenda';$('customer').value=e?.customer_name||'';$('phone').value=e?.customer_phone||'';$('document').value=e?.customer_document||'';$('eventName').value=e?.event_name||'';$('eventType').value=e?.event_type||'';$('eventDate').value=e?.event_date||new Date().toISOString().slice(0,10);$('eventTime').value=e?.event_time?String(e.event_time).slice(0,5):'';$('deadline').value=e?.delivery_deadline?new Date(new Date(e.delivery_deadline).getTime()-new Date(e.delivery_deadline).getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('status').value=e?.status||'Solicitado';$('fulfillment').value=e?.fulfillment_type||'Retirada';$('deliveryFee').value=Number(e?.delivery_fee||0).toFixed(2);$('venue').value=e?.venue||'';$('notes').value=e?.notes||'';$('paymentMethod').value=e?.payment_method||'';$('deposit').value=Number(e?.deposit_amount||0).toFixed(2);$('payment').value=e?.payment_notes||'';$('lines').innerHTML='';(e?.event_items?.length?e.event_items:[null]).forEach(addLine);$('saveMsg').textContent='';syncFulfillment();$('dlg').showModal()}window.editE=id=>openForm(events.find(e=>e.id===id));window.csvE=id=>{const e=events.find(x=>x.id===id);if(!e)return;const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Pedido','Cliente','CPF/CNPJ','Telefone','Evento','Data','Forma','Taxa','Pagamento','Sinal','Saldo','Produto','Quantidade','Unitário','Subtotal Item','Total Geral'],...(e.event_items||[]).map(i=>[e.event_code,e.customer_name,e.customer_document,e.customer_phone,e.event_name,new Date(e.event_date+'T12:00:00').toLocaleDateString('pt-BR'),e.fulfillment_type,e.delivery_fee,e.payment_method,e.deposit_amount,e.balance_amount,i.product_name,i.quantity,Number(i.unit_price).toFixed(2).replace('.',','),(Number(i.unit_price)*Number(i.quantity)).toFixed(2).replace('.',','),grand(e).toFixed(2).replace('.',',')])];const csv='\uFEFF'+rows.map(r=>r.map(q).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${e.event_code}-geladinho-dos-sonhos.csv`;a.click();URL.revokeObjectURL(a.href)};window.deleteE=async id=>{if(!confirm('Excluir esta encomenda? O estoque reservado será devolvido automaticamente.'))return;const r=await GDS48.sb.rpc('delete_event_order',{p_event_id:id});if(r.error)return setMsg(r.error.message,'err');await load()};$('new').onclick=()=>openForm();$('refresh').onclick=load;$('cancel').onclick=()=>$('dlg').close();$('addLine').onclick=()=>addLine();$('fulfillment').onchange=syncFulfillment;$('deliveryFee').oninput=calc;$('deposit').oninput=calc;$('save').onclick=async()=>{if($('save').disabled)return;const items=[...$('lines').children].map(l=>({product_id:l.querySelector('select').value,quantity:Math.max(1,Number(l.querySelector('input').value)||1)}));if(!$('customer').value.trim()||!$('eventName').value.trim()||!$('eventDate').value){$('saveMsg').textContent='Preencha solicitante, evento e data.';return}if(!items.length||items.some(i=>!i.product_id)){$('saveMsg').textContent='Adicione pelo menos um sabor válido.';return}const deadline=$('deadline').value?new Date($('deadline').value).toISOString():null;const args={p_event_id:editing,p_customer_name:$('customer').value.trim(),p_customer_phone:$('phone').value.trim(),p_customer_document:$('document').value.trim(),p_event_name:$('eventName').value.trim(),p_event_type:$('eventType').value.trim(),p_event_date:$('eventDate').value,p_event_time:$('eventTime').value||null,p_delivery_deadline:deadline,p_fulfillment_type:$('fulfillment').value,p_delivery_fee:$('fulfillment').value==='Entrega'?num($('deliveryFee').value):0,p_venue:$('venue').value.trim(),p_notes:$('notes').value.trim(),p_payment_method:$('paymentMethod').value,p_deposit_amount:num($('deposit').value),p_payment_notes:$('payment').value.trim(),p_order_notes:'',p_status:$('status').value,p_items:items};$('saveMsg').textContent='Salvando…';$('save').disabled=true;try{const r=await GDS48.sb.rpc('save_event_order_v57',args);if(r.error)throw r.error;$('dlg').close();await load()}catch(err){$('saveMsg').textContent='Erro ao salvar: '+(err.message||err)}finally{$('save').disabled=false}};try{await GDS48.ensure('events');await load();GDS48.sb.channel('gds-events-admin-v78').on('postgres_changes',{event:'*',schema:'public',table:'events'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'event_items'},()=>load()).subscribe()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message,'err')}})();</script></body></html>
