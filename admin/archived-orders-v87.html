<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><meta name="robots" content="noindex,nofollow,noarchive"><title>Pedidos Arquivados — GDS Admin v87</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1100px;margin:auto;padding:16px 12px 70px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900;min-height:42px;text-decoration:none}.msg{margin:12px 0;padding:11px;background:#fff;border:1px solid #efdde4;border-radius:11px;color:#78616a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.order{background:#fff;border:1px solid #efdde4;border-radius:18px;padding:14px;box-shadow:0 12px 30px #4a101e0d}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.code{font-weight:950;color:#4a101e}.price{margin-left:auto;color:#ff0f68;font-weight:950}.meta{font-size:12px;color:#78616a;margin-top:5px;line-height:1.5}.items{margin:10px 0;background:#fff7fa;border:1px solid #f1e0e7;border-radius:12px;padding:9px}.item{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0}.danger{background:#fff1f3;border:1px solid #f3b8c5;color:#a61f3d;border-radius:9px;padding:9px 11px;font-weight:900}.empty{padding:35px;text-align:center;color:#78616a;background:#fff;border:1px solid #efdde4;border-radius:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><script>window.__gdsAdminStoreOpsV50=true;</script><script src="admin-common-v48.js?v=87"></script><main class="wrap"><div class="head"><div><h1>🗄️ Pedidos arquivados</h1><div style="font-size:12px;color:#78616a">Histórico fechado. Consulte os arquivos e exclua definitivamente quando necessário.</div></div><div class="sp"></div><a class="btn" href="orders-v48.html?v=87">← Pedidos</a><button id="refresh" class="btn">↻ Atualizar</button></div><div id="msg" class="msg">Carregando pedidos arquivados…</div><div id="grid" class="grid"></div></main><script>
(async()=>{const $=x=>document.getElementById(x);let orders=[];
function addr(o){const a=o.address||{};return o.fulfillment==='entrega'?[a.street,a.number,a.district].filter(Boolean).join(', '):'Retirada no local'}
async function load(){const {data,error}=await GDS48.sb.from('orders').select('*,order_items(*)').not('archived_at','is',null).order('archived_at',{ascending:false}).limit(500);if(error){$('msg').textContent='Erro: '+error.message;return}orders=data||[];render();$('msg').textContent='🟢 '+orders.length+' pedido(s) arquivado(s)'}
function render(){$('grid').innerHTML=orders.length?orders.map(o=>'<article class="order"><div class="top"><span class="code">'+GDS48.esc(o.public_code)+'</span><span>'+GDS48.esc(o.customer_name||'')+'</span><span class="price">'+GDS48.money(o.total)+'</span></div><div class="meta">'+new Date(o.created_at).toLocaleString('pt-BR')+' · '+(o.fulfillment==='entrega'?'🛵 Entrega':'🏠 Retirada')+'<br>'+GDS48.esc(addr(o))+'<br>🗄️ Arquivado em '+new Date(o.archived_at).toLocaleString('pt-BR')+' · Status: '+GDS48.esc(o.status)+'</div><div class="items">'+((o.order_items||[]).map(i=>'<div class="item"><span>'+i.quantity+'× '+GDS48.esc(i.product_name)+'</span><b>'+GDS48.money(Number(i.unit_price)*Number(i.quantity))+'</b></div>').join('')||'<div class="item">Itens não disponíveis</div>')+'</div><button class="danger" onclick="deleteArchived(\''+o.id+'\')">🗑️ Excluir definitivamente</button></article>').join(''):'<div class="empty">Nenhum pedido arquivado.</div>'}
window.deleteArchived=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;if(!confirm('EXCLUIR DEFINITIVAMENTE '+o.public_code+'?\n\nEssa ação apagará o pedido, seus itens, histórico e eventual avaliação. Não será possível desfazer.'))return;$('msg').textContent='Excluindo '+o.public_code+'…';const {error}=await GDS48.sb.rpc('delete_archived_store_order_v87',{p_order_id:id});if(error){$('msg').textContent='Erro: '+error.message;return}await load()};
$('refresh').onclick=load;
try{await GDS48.ensure('archived');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))$('msg').textContent='Erro de acesso: '+err.message}
})();
</script></body></html>
