<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><meta name="robots" content="noindex,nofollow,noarchive"><title>Venda no Local — GDS Admin v96</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1200px;margin:auto;padding:16px 12px 80px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.head h1{margin:0;color:#4a101e}.head p{margin:3px 0 0;color:#78616a;font-size:12px}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:12px;padding:11px 13px;font-weight:900;min-height:44px}.primary{background:#ff0f68;color:#fff;border-color:#ff0f68}.successBtn{background:#19a957;color:#fff;border-color:#19a957}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr);gap:14px}.panel{background:#fff;border:1px solid #efdde4;border-radius:20px;padding:14px;box-shadow:0 12px 30px #4a101e0d}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{border:1px solid #efdde4;border-radius:11px;padding:11px;background:#fff}.tools input{flex:1;min-width:180px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{border:1px solid #efdde4;border-radius:16px;padding:11px;background:#fffafc;display:flex;flex-direction:column;gap:7px;min-height:150px}.product h3{margin:0;color:#4a101e;font-size:15px}.cat{font-size:11px;color:#a03b62;font-weight:900;text-transform:uppercase}.stock{font-size:12px;color:#78616a}.stock.low{color:#a95d00;font-weight:800}.price{font-size:20px;font-weight:950;color:#ff0f68}.add{margin-top:auto;border:0;border-radius:10px;padding:10px;background:#4a101e;color:#fff;font-weight:900}.add:disabled{opacity:.45}.cart{position:sticky;top:96px}.cart h2{margin:0 0 10px;color:#4a101e}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #f2e5ea}.row small{display:block;color:#78616a;margin-top:3px}.qty{display:flex;align-items:center;gap:7px;margin-top:6px}.qty button{width:30px;height:30px;border:1px solid #efdde4;background:#fff;border-radius:8px;font-weight:950}.total{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:950;color:#4a101e;padding:14px 0}.form{display:grid;gap:9px}.form input{width:100%;border:1px solid #efdde4;border-radius:11px;padding:11px}.payments{display:grid;grid-template-columns:1fr 1fr;gap:8px}.payments label{border:1px solid #efdde4;border-radius:12px;padding:11px;background:#fff;display:flex;gap:7px;align-items:center;font-weight:900}.paybox{border:1px solid #efdde4;border-radius:14px;padding:10px;background:#fffafc}.pixQr{display:block;width:190px;height:190px;margin:8px auto;background:#fff;padding:6px;border-radius:12px}.msg{margin:10px 0;padding:10px 12px;border-radius:11px;background:#fff;border:1px solid #efdde4;color:#78616a}.ok{color:#14753e}.err{color:#b02a42}.empty{padding:26px;text-align:center;color:#78616a}.receipt{padding:16px;border:1px solid #bfe4ce;background:#effaf3;border-radius:16px;margin-top:12px}.receipt h3{margin:0 0 6px;color:#14753e}.receipt .code{font-size:25px;font-weight:950;color:#4a101e}@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.products{grid-template-columns:1fr}.payments{grid-template-columns:1fr}.wrap{padding:10px 8px 70px}}
</style></head><body><script>window.__gdsAdminStoreOpsV50=true;</script><script src="admin-common-v48.js?v=96"></script><main class="wrap"><div class="head"><div><h1>🏠 Venda no local</h1><p>Venda de balcão/porta com baixa automática do estoque e registro nos relatórios.</p></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar estoque</button></div><div id="msg" class="msg">Carregando produtos…</div><div class="layout"><section class="panel"><div class="tools"><input id="search" type="search" placeholder="Buscar sabor…"><select id="cat"><option value="">Todas categorias</option><option>Tradicional</option><option>Cremoso</option><option>Gourmet</option><option>Trufado</option></select></div><div id="products" class="products"></div></section><aside class="panel cart"><h2>🧾 Venda atual</h2><div id="cartRows"></div><div class="total"><span>Total</span><span id="total">R$ 0,00</span></div><div class="form"><input id="customer" placeholder="Nome do cliente (opcional)"><div><b>Forma de pagamento</b></div><div class="payments"><label><input type="radio" name="pay" value="Pix" checked> 💠 Pix</label><label><input type="radio" name="pay" value="Dinheiro"> 💵 Dinheiro</label></div><div id="pixBox" class="paybox"><div style="font-size:12px;color:#78616a">Mostre este QR Code para o cliente pagar no Pix:</div><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0;font-weight:900;color:#4a101e"><span>Valor exato do Pix</span><span id="pixAmount" style="font-size:20px;color:#ff0f68">R$ 0,00</span></div><img id="pixQr" class="pixQr" width="190" height="190" alt="QR Code Pix"><div id="pixHint" style="font-size:11px;color:#78616a;text-align:center">Adicione produtos para gerar o QR Code.</div></div><button id="finish" class="btn successBtn">✅ Finalizar venda local</button><button id="clear" class="btn">Limpar venda</button></div><div id="receipt"></div></aside></div></main><script>
(async()=>{const $=x=>document.getElementById(x),PIX='00020126590014br.gov.bcb.pix0114+55169925428880219Geladinho_do_Sonhos5204000053039865802BR5918MONIZA_SERIO_LEONI6010MONTE_ALTO62290525OBtb6HFcnS50h7i6lItP47SZu6304BB06';let products=[],cart={};const money=v=>GDS48.money(v);
function setMsg(t,c=''){$('msg').textContent=t;$('msg').className='msg '+c}
function qtyTotal(){return Object.values(cart).reduce((n,q)=>n+q,0)}
function total(){return Object.entries(cart).reduce((n,[id,q])=>{const p=products.find(x=>x.id===id);return n+(p?Number(p.price)*q:0)},0)}
async function load(){setMsg('Carregando estoque…');const {data,error}=await GDS48.sb.from('products').select('id,name,category,price,stock,active').eq('active',true).order('category').order('name');if(error){setMsg('Erro: '+error.message,'err');return}products=data||[];for(const id of Object.keys(cart)){const p=products.find(x=>x.id===id);if(!p||p.stock<=0)delete cart[id];else if(cart[id]>p.stock)cart[id]=p.stock}renderProducts();renderCart();setMsg('🟢 '+products.reduce((n,p)=>n+Number(p.stock||0),0)+' unidades disponíveis no estoque','ok')}
function renderProducts(){const q=$('search').value.trim().toLowerCase(),cat=$('cat').value;const list=products.filter(p=>(!cat||p.category===cat)&&(!q||(p.name+' '+p.category).toLowerCase().includes(q)));list.sort((a,b)=>(a.stock<=0?1:0)-(b.stock<=0?1:0)||a.category.localeCompare(b.category,'pt-BR')||a.name.localeCompare(b.name,'pt-BR'));$('products').innerHTML=list.length?list.map(p=>'<article class="product"><div class="cat">'+GDS48.esc(p.category)+'</div><h3>'+GDS48.esc(p.name)+'</h3><div class="price">'+money(p.price)+'</div><div class="stock '+(p.stock<=5&&p.stock>0?'low':'')+'">'+(p.stock>0?p.stock+' em estoque':'Esgotado')+'</div><button class="add" '+(p.stock<=0?'disabled':'')+' onclick="add(\''+p.id+'\')">'+(p.stock<=0?'Esgotado':'+ Adicionar')+'</button></article>').join(''):'<div class="empty">Nenhum produto encontrado.</div>'}
function crc16(payload){let crc=0xFFFF;for(let i=0;i<payload.length;i++){crc^=payload.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1),crc&=0xFFFF}return crc.toString(16).toUpperCase().padStart(4,'0')}
function pixForAmount(value){const amount=Number(value||0).toFixed(2);let base=PIX.replace(/6304[0-9A-F]{4}$/i,'');base=base.replace(/54\d{2}\d+[.]\d{2}/,'');const field='54'+String(amount.length).padStart(2,'0')+amount;const marker='5802BR';const pos=base.indexOf(marker);if(pos<0)return PIX;const payload=base.slice(0,pos)+field+base.slice(pos)+'6304';return payload+crc16(payload)}
function renderPix(){const value=total();$('pixAmount').textContent=money(value);if(value<=0){$('pixQr').removeAttribute('src');$('pixQr').style.display='none';$('pixHint').textContent='Adicione produtos para gerar o QR Code.';return}const payload=pixForAmount(value);$('pixQr').src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data='+encodeURIComponent(payload);$('pixQr').style.display='block';$('pixQr').onerror=()=>{$('pixQr').style.display='none';$('pixHint').textContent='Não foi possível carregar o QR Code. Atualize a página e tente novamente.'};$('pixHint').textContent='Pix gerado com o valor exato desta venda: '+money(value)}
function renderCart(){const ids=Object.keys(cart).filter(id=>cart[id]>0);$('cartRows').innerHTML=ids.length?ids.map(id=>{const p=products.find(x=>x.id===id),q=cart[id];return '<div class="row"><div><b>'+GDS48.esc(p.name)+'</b><small>'+money(p.price)+' cada</small><div class="qty"><button onclick="adj(\''+id+'\',-1)">−</button><b>'+q+'</b><button onclick="adj(\''+id+'\',1)">+</button></div></div><b>'+money(Number(p.price)*q)+'</b></div>'}).join(''):'<div class="empty">Adicione os produtos desta venda.</div>';$('total').textContent=money(total());$('finish').disabled=!ids.length;renderPix()}
window.add=id=>{const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return;const n=(cart[id]||0)+1;if(n>p.stock)return alert('Estoque disponível: '+p.stock);cart[id]=n;renderCart()};
window.adj=(id,d)=>{const p=products.find(x=>x.id===id);if(!p)return;const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n<=p.stock)cart[id]=n;else return alert('Estoque disponível: '+p.stock);renderCart()};
function syncPay(){$('pixBox').style.display=document.querySelector('input[name="pay"]:checked').value==='Pix'?'block':'none';renderPix()}
async function finish(){const items=Object.entries(cart).filter(([,q])=>q>0).map(([product_id,quantity])=>({product_id,quantity}));if(!items.length)return;const pay=document.querySelector('input[name="pay"]:checked').value;if(!confirm('Finalizar venda de '+money(total())+' em '+pay+'?\n\nO estoque será baixado automaticamente.'))return;$('finish').disabled=true;$('finish').textContent='Registrando venda…';const {data,error}=await GDS48.sb.rpc('create_local_sale_v91',{p_customer_name:$('customer').value.trim()||null,p_payment_method:pay,p_items:items});if(error){alert(error.message);$('finish').disabled=false;$('finish').textContent='✅ Finalizar venda local';return}const r=data||{};$('receipt').innerHTML='<div class="receipt"><h3>✅ Venda registrada</h3><div class="code">'+GDS48.esc(r.public_code||'')+'</div><div>Total: <b>'+money(r.total)+'</b><br>Pagamento: <b>'+GDS48.esc(r.payment_method||pay)+'</b> · Pago<br>'+qtyTotal()+' unidade(s)</div></div>';cart={};$('customer').value='';await load();setMsg('✅ Venda finalizada, estoque atualizado e registrada em Finalizados.','ok');$('receipt').scrollIntoView({behavior:'smooth',block:'nearest'});$('finish').textContent='✅ Finalizar venda local'}
$('finish').onclick=finish;$('refresh').onclick=load;$('search').oninput=renderProducts;$('cat').onchange=renderProducts;$('clear').onclick=()=>{cart={};$('receipt').innerHTML='';renderCart()};document.querySelectorAll('input[name="pay"]').forEach(x=>x.onchange=syncPay);syncPay();try{await GDS48.ensure('local');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message,'err')}})();
</script></body></html>
