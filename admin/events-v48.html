<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Festas e Eventos — GDS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;font-family:Inter,system-ui;color:#29171d}.wrap{max-width:1120px;margin:auto;padding:16px 12px 70px}.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h1{margin:0;color:#4a101e}.sp{flex:1}.btn{border:1px solid #efdde4;background:#fff;color:#4a101e;border-radius:11px;padding:10px 12px;font-weight:900}.primary{background:#ff0f68;color:#fff;border-color:#ff0f68}.msg{margin:12px 0;padding:11px;background:#fff;border:1px solid #efdde4;border-radius:11px;color:#78616a}.ok{color:#14753e}.err{color:#b02a42}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.event{background:#fff;border:1px solid #efdde4;border-radius:18px;padding:14px}.top{display:flex;gap:8px;align-items:center}.code{font-weight:950;color:#4a101e}.status{margin-left:auto;font-size:11px;font-weight:900;background:#fff0f5;border-radius:99px;padding:5px 8px}.meta{font-size:12px;color:#78616a;margin-top:5px}.items{margin:10px 0;background:#fff7fa;border:1px solid #f1e0e7;border-radius:12px;padding:9px}.item{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:1px solid #efdde4;background:#fff;border-radius:9px;padding:8px;font-weight:800}.empty{padding:35px;text-align:center;color:#78616a}dialog{width:min(700px,calc(100% - 20px));max-height:92vh;overflow:auto;border:0;border-radius:22px;padding:0}dialog::backdrop{background:#2a0a1677}.modal{padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{font-size:12px;font-weight:800;color:#78616a}.field input,.field select,.field textarea{display:block;width:100%;margin-top:4px;border:1px solid #efdde4;border-radius:10px;padding:9px;background:#fff}.full{grid-column:1/-1}.lines{grid-column:1/-1;border:1px solid #efdde4;border-radius:12px;padding:10px}.line{display:grid;grid-template-columns:1fr 100px 36px;gap:6px;margin-top:6px}.line select,.line input{border:1px solid #efdde4;border-radius:9px;padding:9px;width:100%}.line button{border:0;border-radius:9px;background:#fff0f5;color:#a42b50;font-weight:900}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><script src="admin-common-v48.js?v=48"></script><main class="wrap"><div class="head"><div><h1>Festas / Eventos</h1><div style="font-size:12px;color:#78616a">Agenda e encomendas com estoque compartilhado</div></div><div class="sp"></div><button id="refresh" class="btn">↻ Atualizar</button><button id="new" class="btn primary">+ Nova encomenda</button></div><div id="msg" class="msg">Carregando eventos…</div><div id="grid" class="grid"></div></main><dialog id="dlg"><div class="modal"><h2 id="title">Encomenda</h2><div class="form"><div class="field"><label>Solicitante<input id="customer"></label></div><div class="field"><label>Telefone<input id="phone"></label></div><div class="field"><label>Evento<input id="eventName"></label></div><div class="field"><label>Tipo<input id="eventType" placeholder="Aniversário, igreja..."></label></div><div class="field"><label>Data<input id="eventDate" type="date"></label></div><div class="field"><label>Horário<input id="eventTime" type="time"></label></div><div class="field"><label>Prazo de entrega<input id="deadline" type="datetime-local"></label></div><div class="field"><label>Status<select id="status"><option>Solicitado</option><option>Orçamento</option><option>Confirmado</option><option>Preparando</option><option>Pronto</option><option>Concluído</option><option>Cancelado</option></select></label></div><div class="field full"><label>Local<input id="venue"></label></div><div class="field full"><label>Observações<textarea id="notes" rows="2"></textarea></label></div><div class="field full"><label>Pagamento / sinal<textarea id="payment" rows="2"></textarea></label></div><div class="lines"><b>Produtos / sabores</b><div id="lines"></div><button id="addLine" class="btn" style="margin-top:8px">+ Adicionar sabor</button><div id="total" style="margin-top:8px;font-weight:900;color:#4a101e"></div></div></div><div id="saveMsg" class="msg"></div><div class="modalBtns"><button id="cancel" class="btn">Cancelar</button><button id="save" class="btn primary">Salvar encomenda</button></div></div></dialog><script>(async()=>{const $=x=>document.getElementById(x);let events=[],products=[],editing=null;function setMsg(t,c=''){$('msg').textContent=t;$('msg').className='msg '+c}async function load(){setMsg('Carregando eventos…');const [e,p]=await Promise.all([GDS48.sb.from('events').select('*,event_items(*)').order('event_date',{ascending:true}),GDS48.sb.from('products').select('id,name,category,price,stock,active').order('sort_order')]);if(e.error){setMsg(e.error.message,'err');return}if(p.error){setMsg(p.error.message,'err');return}events=e.data||[];products=p.data||[];render();setMsg(`🟢 ${events.length} encomendas carregadas`,'ok')}function render(){$('grid').innerHTML=events.length?events.map(e=>`<article class="event"><div class="top"><span class="code">${GDS48.esc(e.event_code)}</span><b>${GDS48.esc(e.customer_name)}</b><span class="status">${GDS48.esc(e.status)}</span></div><div class="meta">${new Date(e.event_date+'T12:00:00').toLocaleDateString('pt-BR')} ${e.event_time?('· '+String(e.event_time).slice(0,5)):''} · ${GDS48.esc(e.event_name)}</div><div class="items">${(e.event_items||[]).map(i=>`<div class="item"><span>${i.quantity}× ${GDS48.esc(i.product_name)}</span><b>${GDS48.money(Number(i.unit_price)*Number(i.quantity))}</b></div>`).join('')}</div><div style="font-weight:950;color:#ff0f68;margin-bottom:9px">${GDS48.money(e.subtotal)} · ${e.stock_reserved?'📦 Estoque reservado':'⏳ Sem reserva'}</div><div class="actions"><button onclick="editE('${e.id}')">Editar</button><button onclick="printE('${e.id}')">PDF / Imprimir</button><button onclick="csvE('${e.id}')">CSV</button><button onclick="deleteE('${e.id}')">Excluir</button></div></article>`).join(''):'<div class="empty">Nenhuma encomenda cadastrada.</div>'}function opts(selected=''){return products.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${GDS48.esc(p.name)} · ${GDS48.money(p.price)} · estoque ${p.stock}</option>`).join('')}function addLine(item=null){const d=document.createElement('div');d.className='line';d.innerHTML=`<select>${opts(item?.product_id||'')}</select><input type="number" min="1" step="1" value="${item?.quantity||1}"><button type="button">×</button>`;d.querySelector('button').onclick=()=>{d.remove();calc()};d.querySelectorAll('select,input').forEach(x=>x.onchange=calc);$('lines').appendChild(d);calc()}function calc(){let qty=0,total=0;[...$('lines').children].forEach(l=>{const p=products.find(x=>x.id===l.querySelector('select').value),q=Math.max(1,Number(l.querySelector('input').value)||1);qty+=q;total+=(Number(p?.price)||0)*q});$('total').textContent=`${qty} unidades · ${GDS48.money(total)}`}function open(e=null){editing=e?.id||null;$('title').textContent=e?`Editar ${e.event_code}`:'Nova encomenda';$('customer').value=e?.customer_name||'';$('phone').value=e?.customer_phone||'';$('eventName').value=e?.event_name||'';$('eventType').value=e?.event_type||'';$('eventDate').value=e?.event_date||new Date().toISOString().slice(0,10);$('eventTime').value=e?.event_time?String(e.event_time).slice(0,5):'';$('deadline').value=e?.delivery_deadline?new Date(new Date(e.delivery_deadline).getTime()-new Date(e.delivery_deadline).getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('status').value=e?.status||'Solicitado';$('venue').value=e?.venue||'';$('notes').value=e?.notes||'';$('payment').value=e?.payment_notes||'';$('lines').innerHTML='';(e?.event_items?.length?e.event_items:[null]).forEach(addLine);$('saveMsg').textContent='';$('dlg').showModal()}window.editE=id=>open(events.find(e=>e.id===id));window.printE=id=>{const e=events.find(x=>x.id===id);if(!e)return;const w=open('','_blank');w.document.write(`<html><head><title>${e.event_code}</title><style>body{font-family:Arial;padding:28px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>Geladinho dos Sonhos</h1><h2>ORDEM DE ENCOMENDA — ${e.event_code}</h2><p><b>Solicitante:</b> ${GDS48.esc(e.customer_name)}<br><b>Evento:</b> ${GDS48.esc(e.event_name)}<br><b>Data:</b> ${new Date(e.event_date+'T12:00:00').toLocaleDateString('pt-BR')}<br><b>Status:</b> ${GDS48.esc(e.status)}</p><table><tr><th>Produto</th><th>Qtd.</th><th>Unit.</th><th>Total</th></tr>${(e.event_items||[]).map(i=>`<tr><td>${GDS48.esc(i.product_name)}</td><td>${i.quantity}</td><td>${GDS48.money(i.unit_price)}</td><td>${GDS48.money(Number(i.unit_price)*Number(i.quantity))}</td></tr>`).join('')}</table><h3>Total: ${GDS48.money(e.subtotal)}</h3><p>Documento comercial de pedido — não é documento fiscal.</p><script>print()<\/script></body></html>`);w.document.close()};window.csvE=id=>{const e=events.find(x=>x.id===id);if(!e)return;const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Número do Pedido','Solicitante','Evento','Data','Status','Produto','Quantidade','Valor Unitário','Subtotal Item','Valor Total'],...(e.event_items||[]).map(i=>[e.event_code,e.customer_name,e.event_name,new Date(e.event_date+'T12:00:00').toLocaleDateString('pt-BR'),e.status,i.product_name,i.quantity,Number(i.unit_price).toFixed(2).replace('.',','),(Number(i.unit_price)*Number(i.quantity)).toFixed(2).replace('.',','),Number(e.subtotal).toFixed(2).replace('.',',')])];const csv='\uFEFF'+rows.map(r=>r.map(q).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${e.event_code}-geladinho-dos-sonhos.csv`;a.click();URL.revokeObjectURL(a.href)};window.deleteE=async id=>{if(!confirm('Excluir esta encomenda? O estoque reservado será devolvido automaticamente.'))return;const r=await GDS48.sb.rpc('delete_event_order',{p_event_id:id});if(r.error)return setMsg(r.error.message,'err');await load()};$('new').onclick=()=>open();$('refresh').onclick=load;$('cancel').onclick=()=>$('dlg').close();$('addLine').onclick=()=>addLine();$('save').onclick=async()=>{const items=[...$('lines').children].map(l=>({product_id:l.querySelector('select').value,quantity:Math.max(1,Number(l.querySelector('input').value)||1)}));const deadline=$('deadline').value?new Date($('deadline').value).toISOString():null;const args={p_event_id:editing,p_customer_name:$('customer').value.trim(),p_customer_phone:$('phone').value.trim(),p_event_name:$('eventName').value.trim(),p_event_type:$('eventType').value.trim(),p_event_date:$('eventDate').value,p_event_time:$('eventTime').value||null,p_delivery_deadline:deadline,p_venue:$('venue').value.trim(),p_notes:$('notes').value.trim(),p_payment_notes:$('payment').value.trim(),p_order_notes:'',p_status:$('status').value,p_items:items};$('saveMsg').textContent='Salvando…';const r=await GDS48.sb.rpc('save_event_order',args);if(r.error){$('saveMsg').textContent=r.error.message;return}$('dlg').close();await load()};try{await GDS48.ensure('events');await load()}catch(err){if(!['NO_SESSION','MFA_REQUIRED'].includes(err.message))setMsg('Erro de acesso: '+err.message,'err')}})();</script></body></html>
